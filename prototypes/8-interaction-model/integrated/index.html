    "prose": "기준 단계는 **총액 단계와, 제1항을 거친 한도 적용 금액 단계 중 높은 단계**로 한다. 두 단계를 더하지 않는다. 한도 초과 청구는 이 둘 중 높은 쪽을 통해 **한 번만** 결재선을 움직인다.",
    "path": "docs/company/approval-matrix.md",
    "line": 123,
    "block": "clause: APV-7-4\nkind: rule\nname: 기준 단계\nvalue: \"max(총액 단계, 상향을 거친 한도 적용 금액 단계)\"\nadditive: false       # 총액 단계와 상향을 더하지 않는다\nrefs: [APV-5-1, APV-7-1]",
    "edition": 1
  },
  "APV-7.2-1": {
    "title": "제7조의2(정산의 하한)",
    "prose": "그 출장에 사전승인 문서가 있으면, 정산 문서의 전결 단계는 **그 사전승인 문서의 전결권자의 단계**보다 낮게 정하지 않는다. 사전승인 문서의 전결권자는 그 문서의 기안 시점에 계산된 사람이며(사전승인이 완료되기 전에 출발한 경우도 같다), 그 단계는 제3조로 정한다. 사전승인 문서 없이 출발한 출장의 정산에는 하한이 없고, 제7조 제1항 제2호가 그 정산을 다룬다.",
    "path": "docs/company/approval-matrix.md",
    "line": 150,
    "block": "clause: APV-7.2-1\nkind: rule\nname: 정산의 하한\napplies_to: [정산]\nwhen: 그 출장에 사전승인 문서가 있을 것\nfloor: 사전승인 문서의 전결권자의 단계   # 기안 시점에 계산된 전결권자. 완료 전 출발이어도 같다\nwhen_absent: 하한 없음                   # APV-7-1 제2호가 다룬다\noperation: \"max(기준 단계, floor)\"\nsource: ADR-0006\nrefs: [APV-3-1, APV-3-2, APV-7-4, APV-11-1]",
    "edition": 1
  },
  "APV-8-1": {
    "title": "제8조(결재선의 계산)",
    "prose": "결재선은 다음 각 호의 순서로 계산한다.\n1. 기안자의 소속 계통에서 **기안자보다 위에 있는 직책자**를 아래에서 위로 늘어놓는다. 기안자에게 직책이 없으면 소속 팀의 팀장부터, 기안자가 팀장이면 그 본부의 본부장부터, 기안자가 본부장이면 대표이사부터 시작한다.\n2. 제5조로 총액 단계를 구한다.\n3. 제5조로 한도 적용 금액 단계를 구하고, 제7조의 상향 사유가 있으면 그 단계를 한 단계 올린다.\n4. 제7조 제4항에 따라 제2호와 제3호 중 높은 단계를 기준 단계로 한다.\n5. 정산 문서이고 그 출장에 사전승인 문서가 있으면 제7조의2에 따라 기준 단계를 사전승인 문서의 전결권자의 단계 아래로 내리지 않는다. 그 결과를 최종 단계로 한다.\n6. 제1호의 목록에서 최종 단계 이상인 직책자 중 **가장 아래에 있는 사람**을 전결권자로 한다.\n7. 결재선은 제1호 목록의 처음부터 전결권자까지로 한다.",
    "path": "docs/company/approval-matrix.md",
    "line": 167,
    "block": "clause: APV-8-1\nkind: algorithm\nname: 결재선 계산\nsteps:\n  - {step: 1, name: chain, value: \"기안자 소속 계통에서 기안자보다 상위인 직책자 목록(아래에서 위로)\"}\n  - {step: 2, name: total_step, from: APV-5-2, input: 총액}\n  - {step: 3, name: limit_step, from: APV-5-2, input: 한도 적용 금액}\n  - {step: 4, name: raised_limit_step, value: \"min(limit_step + 1, 대표이사) if APV-7-1 else limit_step\", from: APV-7-1}\n  - {step: 5, name: base_step, value: \"max(total_step, raised_limit_step)\", from: APV-7-4}\n  - {step: 6, name: final_step, value: \"max(base_step, 사전승인 전결권자의 단계) if 정산 and 사전승인 문서 있음 else base_step\", from: APV-7.2-1}\n  - {step: 7, name: approver, value: \"chain 중 level >= final_step 인 첫 사람\"}\n  - {step: 8, name: line, value: \"chain 의 처음부터 approver 까지\"}\nself_approval: forbidden\nrefs: [APV-5-2, APV-7-1, APV-7-4, APV-7.2-1, APV-3-4]",
    "edition": 1
  },
  "APV-8-2": {
    "title": "제8조(결재선의 계산)",
    "prose": "제1항 제1호에 따라 **기안자 본인은 자기 문서의 결재자가 되지 않는다.** 기안자가 전결 단계에 해당하는 직책을 갖고 있으면 그 위 직책자가 전결권자가 된다.",
    "path": "docs/company/approval-matrix.md",
    "line": 176,
    "block": "",
    "edition": 1

  "APV-9-2": {

  "APV-9-3": {
    "title": "제9조(재무합의)",
    "prose": "재무합의의 성질은 아래 블록과 같다. 이 세 값은 고정 상수가 아니라 **드러낸 설정값**이며, 값이 있는 자리는 이 조항이다.",
    "path": "docs/company/approval-matrix.md",
    "line": 220,
    "block": "clause: APV-9-3\nkind: rule\nname: 재무합의의 성질\nsequential: true          # 재무합의자가 둘이면 순서대로\nblocking: true            # 동의해야 다음 단계로 간다\nreject_always_allowed: true  # 반려 권한을 설정으로 끌 수 없다\nexposed_setting: true\nsource: ADR-0001",

  "PRC-12-1": {
    "title": "제12조(사내 증빙 제출 의무)",
    "prose": "일비를 제외한 **모든 청구 항목**에는 지출 사실과 내용을 보이는 문서를 첨부한다. 숙박은 숙박 명세서, 항공은 전자항공권과 탑승권, 철도·대중교통은 승차권 또는 이용 내역, 등록비는 등록 확인서로 한다.",

  "PRC-13-1": {
    "title": "제13조(법정 판정이 `판정 불가`인 지출)",
    "prose": "법정 증빙 수취 의무의 판정이 `판정 불가`인 지출은 **그 지출의 대사 결과로 처리를 가른다.** 대사 결과가 `대사 완료`인 지출은 **사내 처리에서 `의무 있음`으로 보고** 제2항과 제3항에 따르며, `대사 완료`가 아닌 모든 지출은 제4항과 제5항에 따른다. **증빙에서 읽어낸 결제수단은 이 분기에 쓰지 않는다.** 이 간주와 분기는 사내 처리의 기준일 뿐이며 법정 판정 값을 바꾸지 않는다.",
    "path": "docs/company/travel-procedure.md",
    "line": 215,
    "block": "clause: PRC-13-1\nkind: rule\nname: 판정 불가의 사내 처리\ninput: [법정 판정, 대사 결과]\nvalues: [의무 있음, 의무 면제, 판정 불가]\ninternal_treatment:\n  의무 있음: 적격증빙 확인\n  의무 면제: 사내 증빙 의무만 적용\n  판정 불가:\n    branch_on: 대사 결과              # #18의 대사 상태 어휘를 이름으로만 쓴다\n    not_branch_on: [증빙에서 읽어낸 결제수단]\n    대사 완료: {treat_as: 의무 있음, then: [PRC-13-2, PRC-13-3], blocks_settlement: false}\n    그 밖: {then: [PRC-13-4, PRC-13-5]}   # 대사 완료가 아닌 모든 지출\nchanges_legal_value: false\nrefs: [PRC-12-2, PRC-13-2, PRC-13-3, PRC-13-4, PRC-13-5, APV-10-1]",
    "edition": 1
  },
  "PRC-13-2": {
    "title": "제13조(법정 판정이 `판정 불가`인 지출)",
    "prose": "제1항에 따라 `의무 있음`으로 보는 지출에 적격증빙이 없으면 재무합의자는 그 지출을 **적격증빙을 받지 못한 지출로 기록한다.**",

  "PRC-13-5": {
    "title": "제13조(법정 판정이 `판정 불가`인 지출)",
    "prose": "제4항의 질문 뒤에도 `판정 불가`가 남으면, 재무합의자는 **제출된 자료가 실제 지출과 그 지출의 업무 관련성을 충분히 뒷받침하는 경우**에만 미확인 쟁점 · 검토 자료 · 사내 지급 인정 이유 · 책임자를 남기고 동의한다. 뒷받침할 근거가 없으면 반려한다. 재무합의자가 이 항에서 판단하는 것은 **근거의 충분성**이며, 출장과 지출의 업무상 필요 자체는 판단하지 않는다 — 그것은 결재권자가 본다(`APV-10-2` 제1호). 어느 경우에도 `판정 불가`를 `의무 면제`로 바꾸지 않는다.",
    "path": "docs/company/travel-procedure.md",
    "line": 241,
    "block": "clause: PRC-13-5\nkind: rule\ndiscretion: true\ndiscretion_basis: 제출된 자료가 실제 지출과 그 지출의 업무 관련성을 충분히 뒷받침하는 경우\npreconditions:\n  - 대사 결과가 대사 완료가 아닐 것\n  - 제4항의 질문 뒤에도 판정 불가가 남았을 것\nevidence: [미확인 쟁점, 검토 자료]\nrecord_on_consent: [미확인 쟁점, 검토 자료, 사내 지급 인정 이유, 책임자]\neffect: {뒷받침됨: 동의, 뒷받침되지 않음: 반려}\nchanges_legal_value: false\nfacts_to_ask:            # 물어볼 사실\n  - 판정 불가를 남긴 부족한 사실\n  - 실제 지출을 보이는 다른 자료\n  - 그 지출의 업무 관련성을 보이는 자료\ndecided_by: 재무합의자     # 판단 책임자. APV-10-1 제4호. 근거의 충분성만 — 업무상 필요 자체는 결재권자(APV-10-2 제1호)\nmust_not_auto_decide:    # 금지된 자동 확정\n  - 사내 지급 동의\n  - 법정 판정 값의 변경(판정 불가를 의무 면제로 바꾸는 것)\n  - 이 동의를 출장과 지출의 업무상 필요에 대한 판단으로 보는 것(APV-10-2 제1호)\nrefs: [PRC-13-4, APV-9-5, APV-10-1, APV-10-2]",
    "edition": 1
  },

    "block": "clause: TRV-13-4\nkind: rule\ndiscretion: true\ndiscretion_basis: 출장의 직접 동기를 업무수행으로 보기 어려운 경우\nevidence: [업무일 수, 비업무일 수, 비업무일 비율, 날짜별 업무 수행 내용, 출장 목적]\neffect: 왕복교통비를 업무일·비업무일 비율로 안분\nnon_deterministic_by_design: true\nfacts_to_ask:            # 물어볼 사실\n  - 출장 일정과 사적 일정 중 어느 쪽이 먼저 정해졌는지\n  - 사적 일정이 없었어도 그 출장이 필요했는지\ndecided_by: 결재권자       # 판단 책임자. APV-10-2 제3호\nmust_not_auto_decide:    # 금지된 자동 확정\n  - 출장의 직접 동기를 업무수행으로 보기 어렵다는 판단\n  - 왕복교통비의 안분\nrefs: [TRV-13-2, TRV-13-3, APV-10-2]",

    "kind": "algorithm",

    "steps": [

        "step": 1,

        "value": "기안자 소속 계통에서 기안자보다 상위인 직책자 목록(아래에서 위로)"

        "from": "APV-5-2",
        "input": "한도 적용 금액"

      {
        "step": 4,
        "name": "raised_limit_step",
        "value": "min(limit_step + 1, 대표이사) if APV-7-1 else limit_step",
        "from": "APV-7-1"
      },
      {
        "step": 5,
        "name": "base_step",
        "value": "max(total_step, raised_limit_step)",
        "from": "APV-7-4"

      {
        "step": 6,
        "name": "final_step",
        "value": "max(base_step, 사전승인 전결권자의 단계) if 정산 and 사전승인 문서 있음 else base_step",

        "value": "chain 중 level >= final_step 인 첫 사람"

 upcoming:role==='전체'?[]:sorted(cases.filter(d=>!d.pending&&d.state!=='완료'&&d.line.indexOf(role)>d.at)),
 pending:sorted(visible.filter(d=>d.pending)),
 done:sorted(cases.filter(d=>role==='전체'?d.state==='완료':d.processedBy.includes(role)||d.state==='완료'&&d.owner===role))
};}
function choose(id){selected=id;toast='';render();}
function setRole(value){role=value;const q=queues();selected=[...q.current,...q.upcoming,...q.pending,...q.done][0]?.id||'';toast='';render();}
function setConfig(key,value){if(key==='gate')gate=value;else diff=value;try{const u=new URL(location.href);u.searchParams.delete('variant');u.searchParams.set('gate',gate);u.searchParams.set('diff',diff);history.replaceState(null,'',u);}catch{}render();}
function setClock(value){now='2026-11-18T'+value+':00+09:00';render();}
function row(d,upcoming=false){const u=urgency(d),s=shortage(d);return `<button class="row ${selected===d.id?'selected':''} ${upcoming?'upcoming':''}" data-doc="${d.id}" onclick="choose('${d.id}')" aria-pressed="${selected===d.id}"><div class="rowline"><span class="rowtitle">${d.who} · ${d.place}</span><strong class="mono ${u.css}">${u.label}</strong></div><div class="rowmeta"><span class="chip stage">${d.stage}</span> ${d.id} · ${d.state}</div><div class="rowline"><span>${d.judgment}</span><span>${fmt(d.total)}</span></div>${s?`<span class="shortage">시계 부족 · 남은 ${s.remaining}인 × 3영업일 → ${s.finish.slice(5)} · 완료 기한 ${s.limit.date.slice(5)}</span>`:''}<div class="rowmeta">${upcoming?'아직 내 차례가 아님 · 읽기 전용 / 현재 ':''}${d.owner} ${d.defect?'<span class="chip signal">법적 하자 1</span>':''} ${d.undetermined?'<span class="chip signal">판정 불가 1</span>':''} ${d.discretion?'<span class="chip policychip">재량 조항</span>':''}</div></button>`;}
function render(){
 const d=getCase(selected),q=queues(),owners=[...new Set(cases.flatMap(d=>[d.owner,...(d.line||[])]))];
 const bands=[['지금 내 차례',q.current,false],['다가오는 건',q.upcoming,true],['승인 카드 도달 전',q.pending,false],['처리함 · 완료 / 지급',q.done,false]];
 document.getElementById('app').innerHTML=`<div class="topline"><div><div class="kicker">통합안 · 기한순 대조표</div><h1>지금 판단할 문서, 기한과 근거를 함께.</h1><p class="intro">문서의 기한순으로 읽고, 선택한 한 건을 옆에서 대조합니다. 다가오는 건은 앞선 결재자의 단계에서 읽을 수 있습니다.</p></div><div class="tools"><label>시연 역할 <select id="role" aria-label="시연 역할" onchange="setRole(this.value)"><option value="전체" ${role==='전체'?'selected':''}>전체 사례 · 읽기 전용</option>${owners.map(x=>`<option ${role===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
 <div id="selfcheck" class="selfcheck ${CHECK.failures.length?'bad':''}" role="status">${esc(CHECK.text)}<details><summary>계산 예와 사례 검산 결과</summary><ul>${CHECK.rows.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details></div>
 <div class="config" aria-label="통합안 비교 설정"><label><input id="gate-toggle" type="checkbox" ${gate==='on'?'checked':''} onchange="setConfig('gate',this.checked?'on':'off')">재량 관문 · gate=${gate}</label><label>두 문서 대조 <select id="diff-toggle" onchange="setConfig('diff',this.value)"><option value="all" ${diff==='all'?'selected':''}>전체 · diff=all</option><option value="changed" ${diff==='changed'?'selected':''}>차이와 모름 · diff=changed</option></select></label><span>기준 시각 2026-11-18</span><button data-clock="18:00" aria-pressed="${now.includes('18:00')}" onclick="setClock('18:00')">18:00 KST</button><button data-clock="18:01" aria-pressed="${now.includes('18:01')}" onclick="setClock('18:01')">18:01 KST</button></div>
 <div class="bar"><span><b>${q.current.length}</b>승인·동의 / 보류 문서</span><span><b>${q.upcoming.length}</b>다가오는 건</span><span><b>${q.pending.length}</b>승인 전 입력 대기</span><span class="muted">R1~R4 미측정 · 합성 사례는 지출 모집단이 아닙니다</span></div>
 ${role==='전체'?'<div class="notice">전체 사례는 읽기 전용입니다. 카드에서 현재 책임자의 역할로 전환하거나, 생산본부장·대표이사 역할에서 다가오는 건을 볼 수 있습니다.</div>':''}
 <div class="state"><span><strong>${role==='전체'?'전체 전시':role+'의 큐'}</strong></span><span>진행 중인 기한의 최솟값 → 문서 번호</span><span>선택: ${d?d.id+' / '+d.state:'없음'}</span><span>승인 후 선택 유지</span></div>
 ${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}
 <div class="split"><aside class="queue" aria-label="문서 목록"><div class="qhead"><b>${role==='전체'?'역할별 사례 전체':role+'의 승인자 큐'}</b><p>기한 경과는 표시만 합니다. 완료한 기한은 이력으로 남습니다.</p></div>${bands.map(([title,ds,up])=>`<div class="qband"><strong>${title} · ${ds.length}</strong>${up?'<br>아직 내 차례가 아님 · 읽기 전용':''}</div>${ds.map(d=>row(d,up)).join('')||'<div class="rowmeta" style="padding:0 14px">현재 없음</div>'}`).join('')}</aside>${d?detail(d):'<div class="panel empty">이 역할의 문서가 없습니다.</div>'}</div>
 <p class="bottomnote">규정 3종 판 1 · 모의 달력 2026-10~12 · 기준 시각 ${now.slice(0,16).replace('T',' ')} KST · 상태는 메모리에만 남습니다. 외부 전송·지급은 없습니다.</p>`;
 document.getElementById('statusbar').innerHTML=`<strong>통합안 · gate=${gate} · diff=${diff}</strong><span>기준 시각 ${now.slice(0,16).replace('T',' ')} KST</span><span>선택 ${d?.id||'없음'} · ${d?.state||'—'}</span>`;
}
function detail(d){const u=urgency(d),s=shortage(d);return `<article class="panel" data-selected="${d.id}"><div class="phead"><div class="kicker">${d.pending?'승인 카드 도달 전':'승인 카드'} / ${d.trip} / ${d.id}</div><div class="rowline"><h2>${d.who} · ${d.place} ${d.stage}</h2><span class="chip stage">${d.state}</span></div><div class="docmeta">${d.team} · 직급 ${d.grade} / 직책 ${d.position} · ${d.type}<br>현재 책임자 <strong>${d.owner}</strong> · <strong class="${u.css}">${u.label}</strong> ${u.kind?'('+u.kind+')':''}</div>${role==='전체'?`<div class="titletools"><button onclick="role='${d.owner}';render()">이 역할로 보기 · ${d.owner}</button></div>`:''}${s?`<div class="notice"><strong>시계 부족 — 남은 결재자 ${s.remaining}명</strong><p>${s.path.map(x=>x.who+' '+x.date.slice(5)).join(' → ')}<br>각자 3영업일(PRC-14-1)을 써도 완료 ${s.finish}는 문서 완료 기한 ${s.limit.date}(${s.limit.ref}) 뒤입니다.</p><small>마지막 날 처리·같은 날 다음 사람 도달을 가정한 계산입니다. 강제 기한 단축이나 자동 상향은 하지 않습니다.</small></div>`:''}${d.pending?'':actionView(d)}</div><div class="body">${d.pending?pendingView(d):comparison(d)+policyView(d)+evidenceView(d)+proofView(d)+timeView(d)+auditView(d)}</div></article>`;}
function diffRows(d){const fields=[['총액','total',fmt],['일비','daily',fmt],['숙박비','hotel',fmt],['교통비','flight',fmt],['등록비','registration',fmt],['항공 좌석','seat',String],['지급 대상 숙박','nights',v=>v+'박'],['출장 일수','days',v=>v+'일'],['업무일 / 비업무일','workdays',String],['일정','schedule',String],['행선지','destination',String],['숙소명','hotelName',String],['동행','companion',String],['사적 일정','privateDays',v=>v?v+'일':'없음'],['초과 인정 범위','recognition',fmt]];
 const value=(o,k)=>!o?null:k==='daily'?(o.business==null?null:o.business*rate(d,'TRV-5-2')):k==='workdays'?(o.business==null||o.privateDays==null?null:o.business+'일 / '+o.privateDays+'일'):o[k];
 return fields.map(([label,k,format])=>{const a=value(d.plan,k),b=value(d.actual,k),status=a==null||b==null?'unknown':a===b?'same':'changed';return{label,a,b,format,status};});}
function comparison(d){const c=calculation(d),rows=diffRows(d),same=rows.filter(r=>r.status==='same'),draw=rs=>rs.map(r=>`<tr class="${r.status}" data-diff="${r.status}"><td>${r.label}</td><td>${r.a==null?'자료 없음':esc(r.format(r.a))}</td><td class="marker">${d.actual?{changed:'≠ 바뀜',unknown:'? 알 수 없음',same:'= 같음'}[r.status]:'계획 판단'}</td><td>${d.actual?(r.b==null?'자료 없음':esc(r.format(r.b))):'아직 없음'}</td></tr>`).join(''),table=rs=>`<div class="tablewrap"><table class="comparison-table"><thead><tr><th>판정 입력</th><th>사전승인</th><th class="marker">대조</th><th>정산</th></tr></thead><tbody>${draw(rs)}</tbody></table></div>`;
 return `<section class="section"><h3>${d.actual?'사전승인 ↔ 정산 · 두 열 대조':'사전승인 · 예상액과 한도'}</h3><p class="muted">${d.actual?`${d.preId} · 기안 ${d.preDraft} · 완료 ${d.preCompleted} · ${d.preApprover} 전결 → ${d.id}`:'정산 확정값은 아직 없습니다.'}</p><div class="metrics"><div class="metric"><small>${d.actual?'청구 총액':'예상 총액'}</small><b>${fmt(c.total)}</b></div><div class="metric"><small>한도 적용 금액</small><b>${fmt(c.limit)}</b></div><div class="metric"><small>한도 초과분</small><b>${fmt(c.excess)}</b></div></div><p class="muted">≠ 바뀜 · ? 알 수 없음 · = 같음 — 자료가 없는 값은 같음으로 세지 않습니다.</p>${table(diff==='changed'&&d.actual?rows.filter(r=>r.status!=='same'):rows)}${diff==='changed'&&d.actual&&same.length?`<details id="same-rows"><summary>= 같음 ${same.length}행 접힘 · 펼치기</summary>${table(same)}</details>`:''}<p><strong>${d.actual?'차이의 사유':'기안 사유'}</strong> ${esc(d.reason)}</p><small>계획·일정·청구 필드의 값의 출처: 시스템 연동(한성워크 모의). 숙소명 등 기록 없는 값은 그대로 비웁니다.</small>${d.id==='S-108'?'<div class="notice">총액 차이 0원 · 좌석 등급 ≠ 바뀜. 마일리지 사용 사유는 APV-10-2 제2호의 판단 입력입니다.</div>':''}</section>`;}
function policyView(d){const c=calculation(d),a=d.actual||d.plan;return `<section class="section"><h3>정책 대조 · ${d.judgment}</h3><p class="muted">한도·결재선·재량은 정책 대조 구획에 둡니다. 증빙 파이프라인의 주의 신호 수에는 더하지 않습니다.</p><div class="calc"><div><small>일비 · TRV-5-2</small><b>${fmt(rate(d,'TRV-5-2'))} × ${a.business}업무일</b>${fmt(c.daily)}</div><div><small>숙박 한도 · TRV-6-2</small><b>${fmt(rate(d,'TRV-6-2',d.lodgingGrade||d.grade))} × ${a.nights}박</b>청구 ${fmt(a.hotel)} / 상한 ${fmt(c.cap)}</div><div><small>합계 대조 · TRV-3-7</small><b>초과 ${fmt(c.excess)}</b>한도 적용 금액 ${fmt(c.limit)}</div></div>
 ${d.id==='S-106'?`<p>같은 숙소 요청의 두 상한: 대리 200,000원 × 3박 = 600,000원 / 과장 230,000원 × 3박 = 690,000원. ${d.lodgingGrade?'사람이 상위 상한 적용을 기록함.':'상위 상한 적용은 판단 전이며, 계산은 본인 상한을 사용함.'} 청구 600,000원은 어느 쪽에도 초과하지 않습니다.</p>`:''}
 ${d.id==='P-111'?'<p>왕복교통비 1,550,000원은 기안자의 청구안입니다. 직접 동기가 업무인지 자동 확정하지 않습니다. 안분으로 금액이 바뀌는 선택은 기안 재작성과 부분 승인 처리(#17)가 정해질 때까지 실행하지 않습니다.</p>':''}
 <h3>결재선 · 기안 시점에 확정</h3><div class="calc"><div><small>총액 단계 · APV-5-2</small><b>${fmt(c.total)} → ${lname(c.totalStep)}</b></div><div><small>한도 적용 금액 단계 · APV-7-1</small><b>${fmt(c.limit)} → ${lname(c.withinStep)}</b>${c.reasons.length?'+ 1 → '+lname(c.raisedStep):'+ 0 · 상향 없음'}</div><div><small>높은 단계 · APV-7-4 / 정산 하한</small><b>max(${c.totalStep}, ${c.raisedStep}${d.floor?', '+d.floor:''}) = ${c.finalStep}</b>전결권자 ${person(c.title)}</div></div>
 <p><strong>상향 사유:</strong> ${c.reasons.length?c.reasons.map(r=>r==='사전승인 미완료 출발'?'사전승인 미완료 출발 — PRC-4-1 → APV-7-1 제2호':'한도 초과 청구 — APV-7-1 제1호').join(' / '):'없음'} · 사유가 둘이어도 1단계만 상향합니다.</p>
 ${d.preCompleted>d.depart?`<div class="notice"><strong>기한 → 결재선 되먹임</strong><p>${d.preId} 완료 기한 ${businessShift(d.depart,-RULES['PRC-6-1'].values[d.type])} → 출발 ${d.depart} → 실제 완료 ${d.preCompleted}. 출발 당시 미완료였으므로 정산에서 본부장 → 대표이사로 올라갑니다. 한도 초과 청구는 0원입니다.</p></div>`:''}
 ${d.id==='S-102'?'<p>사전 인정 1,100,000원 안의 초과 1,070,000원: TRV-12-3에 따라 재상향하지 않습니다. APV-7.2-1의 사전승인 전결권자 하한은 본부장입니다.</p>':''}
 <div class="route"><small>${d.who} 기안 →</small>${d.line.map((p,i)=>`<span class="${i===d.at&&d.state!=='완료'?'current':i<d.at?'done':''}">${p}${i<d.at?' · 처리함':i===d.at&&d.state!=='완료'?' · 현재':''}</span>`).join(' → ')}</div><small>직급은 한도를, 직책은 조직 계통과 자기 결재 제외를 정합니다. 결재선 변경은 재작성 때 계산합니다(APV-11-1·APV-11-2).</small>
 <details><summary>적용 정책 원문 · 조항과 구조화 블록</summary>${[...new Set(['TRV-5-2','TRV-6-2',...d.policy,'APV-5-2','APV-7-1','APV-7-4','APV-8-1','APV-11-1',...(d.floor?['APV-7.2-1']:[]),...(d.actual?['APV-9-2','APV-10-1','APV-10-2','APV-10-3']:['APV-10-2'])])].map(id=>quote(id)).join('')}</details></section>`;}
function proofView(d){const a=amounts(d,d.actual||d.plan),labels={hotel:'숙박비',flight:'교통비',registration:'등록비'};return `<section class="section"><h3>${d.actual?'증빙 합계와 청구액 검산':'예상 항목 합계 검산'}</h3>${d.actual?`<table class="proof"><tr><th>합성 증빙</th><th>항목</th><th>확정 원화 금액</th></tr>${d.proofs.map(p=>`<tr><td>${p.id}</td><td>${labels[p.kind]}</td><td>${fmt(p.amount)}</td></tr>`).join('')}</table><p>실비 증빙 합계 ${fmt(d.proofs.reduce((s,p)=>s+p.amount,0))} + 증빙 없이 정액인 일비 ${fmt(a.daily)} = 청구 ${fmt(a.total)}</p>`:`<p>일비 ${fmt(a.daily)} + 숙박비 ${fmt(d.plan.hotel)} + 교통비 ${fmt(d.plan.flight)} + 등록비 ${fmt(d.plan.registration)} = ${fmt(a.total)}</p>`}<small>TRV-4-2 · 증빙 도식은 대표 한 장, 이 표는 전체 실비 내역입니다. 모두 합성 입력이며 실제 OCR·외화 환산은 실행하지 않습니다.</small></section>`;}
function timeView(d){const ds=deadlines(d);return `<section class="section"><h3>기한 · 기준일에서 계산</h3><div class="tablewrap"><table><thead><tr><th>사내 기한</th><th>기준일 → 계산</th><th>결과 · KST</th><th>현재 적용 / 이력</th></tr></thead><tbody>${ds.map(x=>`<tr><td>${x.kind}<br><small>${x.ref} · 판 1</small></td><td>${x.anchor}<br>${x.undefinedDeadline?'규정상 정의 없음 — #8 NOTES 참조':(x.n<0?'전날부터 역산':'다음 날부터')+' '+Math.abs(x.n)+'영업일'}</td><td class="mono">${x.date}<br>${x.undefinedDeadline?'18:00 표시 가정':'18:00'}</td><td>${x.status}${x.late?' · 기안 기한 경과 이력':''}${x.status==='진행'&&x.date===activeDeadline(d)?.date?' · 문서의 기한':''}</td></tr>`).join('')}</tbody></table></div><p class="muted">토·일과 입력 휴일 ${holiday.join(', ')}을 제외한 2026-10~12 모의 달력입니다. 기준일은 세지 않습니다(PRC-3-3). 기한 경과는 표시만 합니다(PRC-15-2).</p>${d.preId?`<p>연결된 사전승인: ${d.preDraft} 기안 → ${d.preCompleted} 완료 / 출발 ${d.depart}. ${d.preCompleted>d.depart?'출발 전 완료 의무 위반 이력(PRC-4-1).':''}</p>`:''}<p>진행 중인 의무의 가장 이른 기한을 정렬에 사용합니다. 이미 기안·처리한 기한은 이력으로 남기고, 보류 답변이 오면 새 도달일부터 다시 계산합니다. “걸린 기한”의 범위와 출발일의 시각 정의는 #8 NOTES의 열린 질문입니다.</p><details><summary>기한 원문</summary>${[...new Set(['PRC-3-3','PRC-3-5','PRC-3-6',...ds.map(x=>x.ref)])].map(id=>quote(id)).join('')}</details></section>`;}
const discretionText={
 'TRV-7-1':{question:'업무상 같은 숙소에 투숙할 필요가 있었는가?',accept:'같은 숙소 필요 인정 · 상위 상한 적용',other:'필요 인정하지 않음'},
 'TRV-12-1':{question:'부득이한 사유와 초과분 지급을 인정하는가?',accept:'부득이한 사유 인정 · 초과분 지급',other:'초과분 지급 인정하지 않음'},
 'TRV-13-4':{question:'출장의 직접 동기를 업무수행으로 볼 수 있는가?',accept:'직접 동기 업무수행 · 왕복교통비 안분 제외',other:'업무 동기로 보기 어려움 · 안분'},
 'PRC-13-5':{question:'자료가 실제 지출과 그 업무 관련성을 충분히 뒷받침하는가?',accept:'근거 충분 · 사내 지급 인정',other:'근거 부족 · 반려'}
};
function questions(d,viewer){const finance=financePeople.includes(viewer),result=[];
 if(finance){result.push(['사내 증빙 요건을 충족하는가?','APV-10-1 제1호'],['법인카드 내역과 증빙의 대사 결과에 남은 쟁점이 있는가?','APV-10-1 제2호'],['환산과 안분 계산의 근거가 맞는가?','APV-10-1 제3호']);if(d.defect)result.push(['법적 하자의 치유에 어떤 자료가 필요한가?','가정 — 규정상 처리자 없음']);}
 else{result.push(['출장과 지출의 업무상 필요가 있는가?','APV-10-2 제1호']);if(d.actual)result.push(['사전승인과 정산의 차이 및 알 수 없는 항목의 사유를 받아들이는가?','APV-10-2 제2호']);}
 d.discs.filter(cl=>d.decidedBy===viewer).forEach(cl=>result.push([discretionText[cl].question,(cl==='PRC-13-5'?'APV-10-1 제4호':'APV-10-2 제3호')+' · '+cl]));
 return result.map(([q,ref])=>`<li>${q}<small>판단 책임자 ${viewer} · ${ref}</small></li>`).join('');
}
function judgmentView(d,cl,canAct){const recorded=d.judgments[cl],mine=role===d.decidedBy&&canAct,t=discretionText[cl],rule=RULES[cl];return `<div class="judgment" data-discretion="${cl}"><strong>${cl} · ${t.question}</strong><p>판단 책임자 ${d.decidedBy} · decided_by: ${rule.decided_by}${cl==='TRV-7-1'||cl==='TRV-13-4'?' · 이 사례는 마지막 결재권자에 배치(가정)':''}</p><small>물어볼 사실: ${esc(d.facts)}<br>모은 근거: ${esc(d.materials)}</small><details><summary>재량 조항 원문 · 자동 결정 금지</summary>${quote(cl)}</details>${recorded?`<div class="readonly"><strong>판단 기록: ${esc(recorded.result)}</strong><p>${esc(recorded.reason)}</p><small>${recorded.by} · ${recorded.at} · 같은 판단을 다시 요구하지 않음(APV-10-3)</small></div>`:mine?`<label style="display:block;margin-top:8px">${cl==='PRC-13-5'?'사내 지급 인정 이유':'판단 이유'}<textarea id="decision-${cl}" placeholder="직접 검토한 사실과 판단 이유를 적으세요"></textarea></label><div class="actions"><button data-record="${cl}" onclick="recordJudgment('${d.id}','${cl}')">${t.accept} · 기록</button><button disabled>${t.other} · #17 대기</button></div><small>${gate==='on'?'판단 기록 뒤에 승인/동의가 열립니다.':'관문 off: 승인/동의 버튼은 먼저 열립니다. 누를 때 위 이유를 함께 기록하는 codex 동작입니다.'}</small>`:`<div class="readonly">읽기 전용 · ${d.decidedBy}의 판단 전. 이 큐에서는 같은 사항을 판단하지 않습니다(APV-10-3).</div>`}</div>`;}
function actionView(d){const canAct=role===d.owner&&!d.pending&&d.state!=='완료'&&d.state!=='보류',finance=financePeople.includes(d.owner),viewer=role==='전체'?d.owner:role,pending=d.discs.filter(cl=>d.decidedBy===role&&!d.judgments[cl]),upcoming=role!=='전체'&&d.line.indexOf(role)>d.at;
 let controls;
 if(d.state==='완료')controls='<p><strong>이 문서의 결재는 완료되었습니다.</strong> 지급·예약 동작은 이 화면에서 실행하지 않습니다.</p>';
 else if(d.state==='보류'&&role===d.owner)controls=`<p>보류 · ${esc(d.questionTo)} 답변 대기: ${esc(d.question)}</p><label>답변 시연<textarea id="answer"></textarea></label><button onclick="receiveAnswer('${d.id}')">답변 도착 시연</button><button disabled>반려 · #17 대기</button>`;
 else controls=`${!canAct?`<p class="muted">${upcoming?'다가오는 건 · 아직 내 차례가 아님 · 읽기 전용':d.processedBy.includes(role)?'이 역할의 처리를 기록했습니다. 선택한 문서를 유지합니다.':'현재 '+d.owner+'의 차례 · 읽기 전용'}</p>`:''}<div class="actions"><button id="approve" class="primary" ${!canAct||gate==='on'&&pending.length?'disabled':''} onclick="approve('${d.id}')">${finance?'동의':'승인'} · ${d.at===d.line.length-1?'문서 완료':'다음 사람에게'}</button><button disabled>반려 · #17 대기</button><button ${canAct?'':'disabled'} onclick="openHold('${d.id}')">보류 · 질문하기</button></div>${canAct&&gate==='on'&&pending.length?`<p class="muted" id="gate-reason">내 몫 재량 판단 ${pending.length}건을 기록하기 전에는 ${finance?'동의':'승인'}할 수 없습니다.</p>`:''}<div id="holdForm"></div>`;
 return `<div class="actionbox" id="todo"><strong>할 일 · 내 몫 질문${role==='전체'?' (현재 책임자 미리보기)':''}</strong><ol class="questions">${questions(d,viewer)}</ol>${d.discs.map(cl=>judgmentView(d,cl,canAct)).join('')}${controls}</div>`;}
function saveJudgment(d,cl,reason){
 if(!reason)return false;
 const t=discretionText[cl];d.judgments[cl]={result:t.accept,reason,by:d.owner,at:now.slice(0,16).replace('T',' ')};
 if(cl==='TRV-7-1')d.lodgingGrade='과장';
 record(d,'재량 판단 기록 · '+cl,`${t.accept} / 미확인 쟁점·물어본 사실: ${d.facts} / 검토 자료: ${d.materials} / 판단 이유: ${reason} / 법정 판정 값 유지: ${d.legal||'해당 없음'}`);
 return true;
}
function recordJudgment(id,cl){const d=getCase(id);if(d.owner!==role||d.decidedBy!==role||d.state==='보류'||d.state==='완료'||!d.discs.includes(cl)||d.judgments[cl])return;const el=document.getElementById('decision-'+cl),reason=el.value.trim();if(!reason){el.setAttribute('aria-invalid','true');el.placeholder='판단 이유를 입력해야 기록할 수 있습니다.';el.focus();return;}saveJudgment(d,cl,reason);toast=id+' · 재량 판단을 기록했습니다. 승인/동의는 별도 행위입니다.';render();}
function approve(id){const d=getCase(id);if(d.owner!==role||d.pending||d.state==='보류'||d.state==='완료')return;
 const pending=d.discs.filter(cl=>d.decidedBy===role&&!d.judgments[cl]);if(gate==='on'&&pending.length)return;
 if(gate==='off')for(const cl of pending){const el=document.getElementById('decision-'+cl),reason=el?.value.trim();if(!reason){el?.setAttribute('aria-invalid','true');if(el){el.placeholder='버튼은 열려 있지만 codex 방식도 판단 이유 기록은 필요합니다.';el.focus();}return;}saveJudgment(d,cl,reason);}
 const actor=d.owner;record(d,financePeople.includes(actor)?'동의':'승인','문서 전체를 판단함 · gate='+gate,actor);d.processedBy.push(actor);d.at++;
 if(d.at>=d.line.length){d.state='완료';if(d.stage==='정산')d.completed=now.slice(0,10);}else{d.owner=d.line[d.at];d.arrived=now.slice(0,10);d.state=financePeople.includes(d.owner)?'재무합의대기':'결재대기';}
 toast=id+' · '+actor+'의 '+(financePeople.includes(actor)?'동의':'승인')+'를 기록했습니다. 선택한 문서를 유지합니다. '+(d.state==='완료'?'문서 완료.':'다음 차례: '+d.owner+'.');render();
}
function selfCheck(){const rows=[],failures=[];let examplePass=0,moneyPass=0,proofPass=0;
 const check=(name,ok,detail='')=>{rows.push((ok?'통과 ':'실패 ')+name+(detail?' · '+detail:''));if(!ok)failures.push(name+': '+detail);};
 // Expected values come from the unmodified non-normative E1–E10 vectors.
 for(const e of RULES['APV-예시'].cases){const x=e.input,k=e.기안자,expected=e.expected,floor=x.사전승인전결권자?(x.사전승인전결권자==='대표이사'?3:/본부장|연구소장/.test(x.사전승인전결권자)?2:1):0;
  const c=authority({type:x.출장유형,total:x.총액,limit:x.한도적용금액,stage:x.문서유형,team:k.소속,position:k.직책,reasons:x.상향사유,floor});
  const ok=c.total===x.총액&&c.limit===x.한도적용금액&&c.title===expected.전결권자&&JSON.stringify(c.apv)===JSON.stringify(expected.결재선)&&JSON.stringify(c.fin)===JSON.stringify(expected.재무합의||[])&&c.totalStep===levels[expected.총액단계]&&c.withinStep===levels[expected.한도적용금액단계]&&c.raisedStep===levels[expected.상향후단계]&&c.baseStep===levels[expected.기준단계]&&c.finalStep===levels[expected.최종단계];
  if(ok)examplePass++;check(e.id,ok,fmt(c.total)+' / '+fmt(c.limit)+' / '+c.title);
 }
 for(const d of cases.filter(d=>!d.pending)){
  const c=calculation(d),p=amounts(d,d.plan),ok=c.total===d.total&&c.limit===d.limit&&c.excess===d.excess&&p.total===d.plan.total&&JSON.stringify(c.line)===JSON.stringify(d.line);
  if(ok)moneyPass++;check(d.id+' 항목 합계·결재선',ok,fmt(c.total)+' / '+fmt(c.limit)+' / '+c.line.join(' → '));
  if(d.actual){const subtotal=d.proofs.reduce((s,e)=>s+e.amount,0),keys=['hotel','flight','registration'],proofOK=keys.every(k=>d.proofs.filter(e=>e.kind===k).reduce((s,e)=>s+e.amount,0)===d.actual[k])&&subtotal+c.daily===d.total;
   if(proofOK)proofPass++;check(d.id+' 증빙 합계',proofOK,fmt(subtotal)+' + 일비 '+fmt(c.daily)+' = '+fmt(d.total));
  }
 }
 check('E-109·E-110 대기 경계',cases.filter(d=>d.pending).every(d=>d.total==null),'확정 청구액 없음 · 증빙 100 MXN / 23,000 JPY와 카드 150 USD는 서로 합산하지 않음');
 const short=shortage(getCase('P-103'));check('시계 부족 영업일',short?.finish==='2026-11-25'&&short.limit.date==='2026-11-23','11/17 → 11/20 → 11/25 > 11/23');
 check('늦은 기안 출발일',activeDeadline(getCase('P-114'))?.date==='2026-11-19','기안 11/18, 기안 기한 11/17, 출발 11/19');
 check('자료 없음은 같음 아님',diffRows(getCase('S-106')).find(r=>r.label==='숙소명').status==='unknown'&&diffRows(getCase('S-108')).find(r=>r.label==='숙소명').status==='unknown');
 return{rows,failures,text:failures.length?'자체 점검 실패 — '+failures.join(' / '):`자체 점검 통과 — 전결표 ${examplePass}/10 · 사례 금액·결재선 ${moneyPass}/12 · 정산 증빙 합계 ${proofPass}/7 · 대기 2건 청구 미확정`};
}
const CHECK=selfCheck();
render();
</script></body></html>
