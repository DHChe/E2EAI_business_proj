  "APV-7.2-1": {

    "path": "docs/company/approval-matrix.md",
    "line": 150,
    "prose": "그 출장에 사전승인 문서가 있으면, 정산 문서의 전결 단계는 **그 사전승인 문서의 전결권자의 단계**보다 낮게 정하지 않는다. 사전승인 문서의 전결권자는 그 문서의 기안 시점에 계산된 사람이며(사전승인이 완료되기 전에 출발한 경우도 같다), 그 단계는 제3조로 정한다. 사전승인 문서 없이 출발한 출장의 정산에는 하한이 없고, 제7조 제1항 제2호가 그 정산을 다룬다.",
    "block": "clause: APV-7.2-1\nkind: rule\nname: 정산의 하한\napplies_to: [정산]\nwhen: 그 출장에 사전승인 문서가 있을 것\nfloor: 사전승인 문서의 전결권자의 단계   # 기안 시점에 계산된 전결권자. 완료 전 출발이어도 같다\nwhen_absent: 하한 없음                   # APV-7-1 제2호가 다룬다\noperation: \"max(기준 단계, floor)\"\nsource: ADR-0006\nrefs: [APV-3-1, APV-3-2, APV-7-4, APV-11-1]",

  "APV-8-1": {
    "title": "전결표 제8조 제1항",
    "path": "docs/company/approval-matrix.md",
    "line": 167,
    "prose": "결재선은 다음 각 호의 순서로 계산한다.\n1. 기안자의 소속 계통에서 **기안자보다 위에 있는 직책자**를 아래에서 위로 늘어놓는다. 기안자에게 직책이 없으면 소속 팀의 팀장부터, 기안자가 팀장이면 그 본부의 본부장부터, 기안자가 본부장이면 대표이사부터 시작한다.\n2. 제5조로 총액 단계를 구한다.\n3. 제5조로 한도 적용 금액 단계를 구하고, 제7조의 상향 사유가 있으면 그 단계를 한 단계 올린다.\n4. 제7조 제4항에 따라 제2호와 제3호 중 높은 단계를 기준 단계로 한다.\n5. 정산 문서이고 그 출장에 사전승인 문서가 있으면 제7조의2에 따라 기준 단계를 사전승인 문서의 전결권자의 단계 아래로 내리지 않는다. 그 결과를 최종 단계로 한다.\n6. 제1호의 목록에서 최종 단계 이상인 직책자 중 **가장 아래에 있는 사람**을 전결권자로 한다.\n7. 결재선은 제1호 목록의 처음부터 전결권자까지로 한다.",
    "block": "clause: APV-8-1\nkind: algorithm\nname: 결재선 계산\nsteps:\n  - {step: 1, name: chain, value: \"기안자 소속 계통에서 기안자보다 상위인 직책자 목록(아래에서 위로)\"}\n  - {step: 2, name: total_step, from: APV-5-2, input: 총액}\n  - {step: 3, name: limit_step, from: APV-5-2, input: 한도 적용 금액}\n  - {step: 4, name: raised_limit_step, value: \"min(limit_step + 1, 대표이사) if APV-7-1 else limit_step\", from: APV-7-1}\n  - {step: 5, name: base_step, value: \"max(total_step, raised_limit_step)\", from: APV-7-4}\n  - {step: 6, name: final_step, value: \"max(base_step, 사전승인 전결권자의 단계) if 정산 and 사전승인 문서 있음 else base_step\", from: APV-7.2-1}\n  - {step: 7, name: approver, value: \"chain 중 level >= final_step 인 첫 사람\"}\n  - {step: 8, name: line, value: \"chain 의 처음부터 approver 까지\"}\nself_approval: forbidden\nrefs: [APV-5-2, APV-7-1, APV-7-4, APV-7.2-1, APV-3-4]",
    "edition": 1
  },

    "prose": "제4항의 질문 뒤에도 `판정 불가`가 남으면, 재무합의자는 **제출된 자료가 실제 지출과 그 지출의 업무 관련성을 충분히 뒷받침하는 경우**에만 미확인 쟁점 · 검토 자료 · 사내 지급 인정 이유 · 책임자를 남기고 동의한다. 뒷받침할 근거가 없으면 반려한다. 재무합의자가 이 항에서 판단하는 것은 **근거의 충분성**이며, 출장과 지출의 업무상 필요 자체는 판단하지 않는다 — 그것은 결재권자가 본다(`APV-10-2` 제1호). 어느 경우에도 `판정 불가`를 `의무 면제`로 바꾸지 않는다.",

<div class="bar"><span><b>${active.length}</b>승인·동의 / 보류 문서</span><span><b>${items.filter(x=>x.pending).length}</b>승인 전 입력 대기</span><span><b>${items.filter(x=>x.state==='완료').length}</b>완료 · 지급</span><span class="muted">R1–R4 미측정 · 12개 사례는 지출 모집단이 아닙니다</span></div>
${role==='전체'?'<div class="notice">여러 역할의 사례를 비교하는 읽기 전용 전시입니다. 실제 승인자 큐는 한 사람의 문서만 담습니다. 문서에서 “이 역할로 보기”를 누르면 그 사람의 판단 범위를 시연합니다.</div>':''}
<div class="state" aria-live="polite"><span><strong>${variant.toUpperCase()} · ${names[variant]}</strong></span><span>정렬/묶음: ${axes[variant]}</span><span>선택: ${d?d.id+' / '+d.state:'없음'}</span><span>기준 시각 ${now.slice(0,16).replace('T',' ')} KST</span></div>${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}
${variant==='a'?`<div class="split"><aside class="queue"><div class="qhead"><b>${role==='전체'?'역할별 사례 전체':role+'의 승인자 큐'}</b><p>현재 걸린 기한의 최솟값 · 완료된 기한은 이력에 보존</p></div>${items.map(row).join('')||'<div class="empty">이 역할의 문서가 없습니다.</div>'}</aside>${d?detail(d):'<div class="panel empty">문서를 선택하세요.</div>'}</div>`:variant==='b'?variantB(items):variantC(items,d)}

document.getElementById('switcher').innerHTML=`<button onclick="cycle(-1)" aria-label="이전 안">←</button><label>안 비교</label>${Object.keys(names).map(k=>`<button class="${variant===k?'active':''}" onclick="switchVariant('${k}')" aria-pressed="${variant===k}">${k.toUpperCase()} ${names[k]}</button>`).join('')}<button onclick="cycle(1)" aria-label="다음 안">→</button>`;
document.getElementById('overlay').innerHTML=variant==='b'&&drawer&&d?`<div class="drawer" onclick="if(event.target===this){drawer=false;render()}"><section class="panel" role="dialog" aria-modal="true" aria-label="승인 카드 ${d.id}"><div class="drawerclose"><b>선택 ${d.id} · ${d.state}</b><button onclick="drawer=false;render()">큐로 돌아가기</button></div>${detail(d,true)}</section></div>`:'';}
function variantB(items){const groups=['증빙 법정 판정','정책 대조','규칙 대조 완료'];return `<div class="sectiongrid">${groups.map(g=>{const rows=items.filter(x=>group(x)===g);return `<section class="group"><h2>${g} <small>${rows.length}문서</small></h2><p>${g==='증빙 법정 판정'?'법적 하자와 판정 불가를 서로 다른 칸으로 표시합니다.':g==='정책 대조'?'한도·사전승인과의 차이·재량을 기존 결재선에서 판단합니다.':'에이전트가 계산을 마쳤습니다. 승인·동의는 사람의 차례입니다.'}</p>${rows.map(row).join('')||'<p class="muted">현재 없음</p>'}</section>`;}).join('')}</div>${['보류 · 답변 대기','승인 카드 도달 전','완료 · 지급'].map(g=>{const rows=items.filter(x=>group(x)===g);return `<details class="rollup" ${g!=='완료 · 지급'?'open':''}><summary><b>${g} · ${rows.length}건</b> <small>접어도 집계에서 빠지지 않음</small></summary>${rows.map(row).join('')||'<p class="muted">현재 없음</p>'}</details>`;}).join('')}`;}
function variantC(items,d){return `<div class="pointer"><div class="pointerhead"><button onclick="move(-1)">이전 문서</button><div><div class="number">${Math.max(0,items.findIndex(x=>x.id===selected)+1)} <small>/ ${items.length}건</small></div><small>기한순 큐 · 처리 후 자동 이동 없음</small></div><button onclick="move(1)">다음 문서</button></div><details class="pointerlist"><summary>큐 전체 펼치기 · ${items.filter(x=>urgency(x).label==='기한 경과').length}건 기한 경과 · ${items.filter(x=>x.pending||x.state==='보류').length}건 대기</summary><div class="rows">${items.map(row).join('')}</div></details>${d?detail(d):'<div class="panel empty">현재 없음</div>'}</div>`;}
function detail(d,inside=false){const u=urgency(d);const mode=d.pending?'승인 카드 도달 전':d.state==='완료'?'완료 문서':'승인 카드';const finance=['남윤호','임가온'].includes(d.owner);return `${inside?'':'<article class="panel">'}<div class="phead"><div class="kicker">${mode} / ${d.trip} / ${d.id}</div><div class="rowline"><h2>${d.who} · ${d.place} ${d.stage}</h2><span class="chip stage">${d.state}</span></div><div class="docmeta">${d.team} · 직급 ${d.grade} / 직책 ${d.position} · ${d.type}<br>현재 책임자 <strong>${d.owner}</strong> · <strong class="${u.css}">${u.label}</strong> ${u.kind?'('+u.kind+')':''}</div>${role==='전체'?`<button style="margin-top:10px" onclick="role='${d.owner}';drawer=variant==='b';render()">이 역할로 보기 · ${d.owner}</button>`:''}${d.id==='P-101'?`<div class="policy"><div class="policyhead">여비규정 제6조 제2항 · TRV-6-2 · 판 1</div><blockquote>${esc(POLICY['TRV-6-2'].prose).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</blockquote><p><b>230,000원 × 4박 = 920,000원</b> ↔ 숙박 청구 2,020,000원<br>초과 <b>1,100,000원</b> → 한도 초과 청구(TRV-12-1) → <b>팀장에서 본부장으로</b>(APV-7-1·APV-7-4)</p><small>원문·계산·결재선의 연결. 판단 이유와 전체 계산은 정책 대조 구획에 있습니다.</small></div>`:''}</div>
${variant==='c'&&!d.pending?`<div class="tabs" role="tablist" aria-label="판단 자료">${[['comparison','두 봉우리'],['policy','정책·결재선'],['evidence','증빙·출처'],['time','기한·기록']].map(([key,label])=>`<button role="tab" aria-selected="${tab===key}" class="${tab===key?'active':''}" onclick="tab='${key}';render()">${label}</button>`).join('')}</div>`:''}

function comparison(d){const p=d.plan,a=d.actual;const title=a?'② 정산 — 확정값과 ① 사전승인의 차이':'① 사전승인 — 예상액과 한도';const dailyRate=d.type==='국내 출장'?(['부장','임원'].includes(d.grade)?50000:40000):d.place==='하노이'?80000:d.grade==='대리'?80000:90000;
const rows=[['청구 총액 / 예상 총액','total',v=>fmt(v)],['일비','daily',v=>fmt(v)],['숙박비','hotel',v=>fmt(v)],['교통비','flight',v=>fmt(v)],['등록비','registration',v=>fmt(v)],['항공 좌석 등급','seat',v=>v],['숙박 박수','nights',v=>v+'박'],['출장 일수','days',v=>v+'일'],['업무일 / 비업무일','workdays',v=>v],['행선지','destination',v=>v],['동행','companion',v=>v],['사적 일정','privateDays',v=>v===0?'없음':v+'일'],['한도 초과 청구 인정 범위','recognition',v=>fmt(v)]];
const value=(obj,key)=>key==='daily'?obj.business*dailyRate:key==='workdays'?obj.business+'일 / '+obj.privateDays+'일':obj[key];
return `<section class="section"><h3>${title}</h3><p class="muted">${a?`같은 출장 ${d.trip} · 사전승인 ${d.preId} (완료, ${d.preApprover} 전결) → 정산 ${d.id}. 자료 없는 값은 “자료 없음”으로 남깁니다.`:'승인 대상은 계획입니다. 정산 값은 아직 생기지 않았으며 “변경 없음”으로 표시하지 않습니다.'}</p>
<div class="metrics"><div class="metric"><small>${a?'청구 총액':'예상 총액'}</small><b>${fmt(d.total)}</b></div><div class="metric"><small>한도 적용 금액</small><b>${fmt(d.limit)}</b></div><div class="metric"><small>${d.raise?'한도 초과 청구분':'한도 초과분'}</small><b>${fmt(d.excess)}</b></div></div>

<p><strong>${a?'차이의 사유':'기안 사유'}</strong> ${d.reason}</p><p class="muted">${a?'계획·확정 일정과 기안 필드의 값의 출처: 시스템 연동(한성워크 모의). 증빙의 필드별 출처·검증 수준은 아래 증빙 구획에서 봅니다.':'계획 필드의 값의 출처: 시스템 연동(한성워크 모의). 예상액은 증빙 추출값이 아닙니다.'}</p>
${d.id==='S-108'?'<div class="notice">금액 차이 0원이어도 좌석 등급이 달라졌습니다. 결재권자가 마일리지 사용 사유를 판단합니다.</div>':''}${d.id==='S-102'?'<div class="notice">사전 인정 1,100,000원 안의 정산 초과 1,070,000원. 상향 사유를 다시 붙이지 않고 사전승인의 본부장 하한을 유지합니다.</div>':''}</section>`;}
function policyView(d){const total=level(d,d.total),base=level(d,d.limit),raised=Math.min(3,base+(d.raise?1:0)),final=Math.max(total,raised,d.floor||0);return `<section class="section"><h3>정책 대조 · ${d.judgment}</h3><p class="muted">정책 대조는 별도 구획입니다. 증빙 파이프라인의 주의 신호 수에는 더하지 않습니다.</p>
${d.id==='P-101'?`<div class="calc"><div><small>조항의 계산 입력</small><b>과장 × 가 등급 × 4박</b>230,000 × 4 = 920,000원<br>숙박비 2,020,000원</div><div><small>금액 대조</small><b>초과 1,100,000원</b>다른 여비 3,185,000원<br>한도 적용 4,105,000원</div><div><small>결재선에 닿는 결과</small><b>팀장 → 본부장</b>한도 초과 청구가 상향 사유<br>총액 단계와 더하지 않음</div></div>`:''}
${d.policy.map(id=>quote(id,id==='TRV-6-2'&&d.id==='P-101')).join('')}
${d.discretion?`<div class="notice">${d.discretionDecided?'<p><strong>이 재량 판단은 기록되었습니다. 다음 역할에 같은 판단을 다시 요구하지 않습니다.</strong></p>':''}<strong>재량 판단 책임자: ${d.discretion==='PRC-13-5'?'남윤호 · 재무합의자(근거의 충분성)':'영업본부장 · 올라간 결재권자(초과분의 지급)'}</strong><p>물어볼 사실: ${d.facts}</p><p>모은 근거: ${d.materials}</p><p>에이전트가 결정하지 않은 것: ${d.discretion==='PRC-13-5'?'사내 지급 동의·법정 판정 값의 변경·업무상 필요 판단':'부득이한 사유의 인정·초과분의 지급'}</p></div>`:''}
<h3 style="margin-top:20px">결재선 · 기안 시점에 확정</h3><div class="calc"><div><small>총액 단계 · APV-5-2</small><b>${fmt(d.total)} → ${lname(total)}</b></div><div><small>한도 적용 금액 단계 · APV-7-1</small><b>${fmt(d.limit)} → ${lname(base)} ${d.raise?'+ 1 → '+lname(raised):'+ 0'}</b></div><div><small>높은 단계 + 정산의 하한</small><b>max(${total}, ${raised}${d.floor?', '+d.floor:''}) = ${final} · ${lname(final)}</b>${d.floor?'사전승인 전결권자 하한 '+lname(d.floor):'사전승인: 하한 없음'}</div></div>
<div class="route"><small>${d.who} 기안 →</small>${d.line.map((person,i)=>`<span class="${i===d.at?'current':i<d.at?'done':''}">${person}${i<d.at?' · 처리함':i===d.at?' · 현재':''}</span>${i<d.line.length-1?'→':''}`).join('')}</div><small>전결권자 ${d.line[d.line.length-1]} · 자기 결재 금지 · 기안 시점 조직 계통 · 역할을 임의로 지정할 수 없음</small>
<details style="margin-top:12px"><summary>결재선 계산에 쓴 조항 원문</summary>${quote('APV-5-2')}${quote('APV-7-1')}${quote('APV-7-4')}${d.floor?quote('APV-7.2-1'):''}${quote('APV-8-1')}${d.stage==='정산'?quote('APV-9-2')+quote('APV-9-3'):''}</details>
${d.stage==='정산'?'<p class="muted">재무합의: 순차 · 차단 · 항상 반려 허용(APV-9-3). 재무합의는 근거의 충분성, 결재권자는 업무상 필요를 판단합니다. 같은 사항을 두 역할이 다시 판단하지 않습니다.</p>':'<p class="muted">사전승인에는 재무합의가 없습니다. 마지막 승인 뒤 총무팀이 예약에 착수하고 인사팀이 확정 일정의 근태를 반영합니다.</p>'}</section>`;}
function evidenceView(d){if(d.stage==='사전승인')return `<section class="section"><h3>에이전트가 마친 일</h3><p>한성워크의 계획·조직 정보 수신 → 한도 대조 → 전결표 계산 → 기한 계산.</p><p class="muted">증빙 추출·대사·법정 판정은 아직 대상이 없습니다. 사전승인에 정상 증빙이라는 결과를 만들지 않습니다.</p></section>`;
return `<section class="section"><h3>증빙 파이프라인의 주의 신호</h3><div class="signalgrid"><div class="signalcell ${d.defect?'on':''}">법적 하자 <b>${d.defect||0}건</b><small style="display:block">${d.defect?'기재사항 결손 · 읽기 실패가 아님':'법정 요건 하자 없음'}</small></div><div class="signalcell ${d.undetermined?'on':''}">수취 의무 판정의 판정 불가 <b>${d.undetermined||0}건</b><small style="display:block">${d.id==='S-106'?'대사 완료 → 사내 기록만 · 추가 판단 0건':d.undetermined?'대사 완료 아님 → 보류 질문 후 재량 판단':'판정 불가 없음'}</small></div></div>

function auditView(d){return `<section class="section"><h3>감사 로그 · 행위자 / 책임자</h3><ul class="timeline"><li><strong>${d.pending?'증빙 추출·대사에서 대기':'규정 대조·결재선·기한 계산'}</strong><small>행위자: 출장 에이전트 · 책임자: ${d.calculationResponsible} · 판정 입력의 값의 출처는 필드 표에 보존</small></li>${d.id==='S-106'||d.id==='S-107'?`<li><strong>수기 확정 · 확정 불가로 닫힘</strong><small>행위자: ${d.who} · 책임자: ${d.who} · 에이전트 판독값: 지면에 없음 → 확정값: 확정 불가 · 원본 열람: 예</small></li>`:''}${d.log.map(l=>`<li><strong>${esc(l.action)}</strong><small>${esc(l.at)} KST · 행위자 ${esc(l.actor)} · 책임자 ${esc(l.responsible)}<br>${esc(l.detail)}</small></li>`).join('')}</ul><small>초기 기록은 합성 예시입니다. 이후 버튼으로 만든 기록은 이 탭의 메모리에만 남습니다.</small></section>`;}
function actionView(d,finance){const needsDecision=d.discretion&&!d.discretionDecided&&(d.discretion==='PRC-13-5'?finance:d.owner===d.line[d.line.length-1]);if(d.state==='완료')return `<div class="actionbox"><strong>이 문서의 결재는 완료되었습니다.</strong><p>${d.stage==='정산'?'지급 기한은 완료일에서 계산합니다. 지급·송금 동작은 이 프로토타입에 없습니다.':'총무팀의 예약 착수와 인사팀의 근태 반영으로 이어집니다. 새로운 결재 단계는 만들지 않습니다.'}</p></div>`;

return `<div class="actionbox"><strong>${finance?'재무합의자의 판단: 증빙·대사·근거의 충분성':'결재권자의 판단: 업무상 필요·두 봉우리의 차이'}</strong><p class="muted">${needsDecision?'재량 사유를 기록해야 진행합니다. 조항을 읽었다는 확인 버튼은 따로 만들지 않습니다.':'한 번의 판단은 문서 전체에 적용됩니다.'}</p>${needsDecision?`<label>${d.discretion==='PRC-13-5'?'사내 지급 인정 이유 (미확인 쟁점·검토 자료는 위 구획에 보존)':'부득이한 사유 인정 및 초과분 지급 이유'}<textarea id="decisionReason" placeholder="직접 판단한 이유를 적으세요"></textarea></label>`:''}<div class="actions"><button class="primary" onclick="approve('${d.id}')">${finance?'동의':'승인'} · ${d.at===d.line.length-1?'문서 완료':'다음 사람에게'}</button><button disabled>반려 · #17 대기</button><button onclick="openHold('${d.id}')">보류 · 질문하기</button></div><div id="holdForm"></div></div>`;}

function approve(id){const d=cases.find(x=>x.id===id);if(role!==d.owner||d.pending||d.state==='보류'||d.state==='완료')return;const needsDecision=d.discretion&&!d.discretionDecided&&(d.discretion==='PRC-13-5'?['남윤호','임가온'].includes(d.owner):d.owner===d.line[d.line.length-1]);const reason=document.getElementById('decisionReason')?.value.trim()||'';if(needsDecision&&!reason){toast='재량 조항의 판단 이유를 직접 기록하세요.';const el=document.getElementById('decisionReason');el.setAttribute('aria-invalid','true');el.focus();return;}

function openHold(id){document.getElementById('holdForm').innerHTML=`<hr><label>질문 상대 <select id="questionTo"><option>기안자</option><option>에이전트</option></select></label><label style="display:block;margin-top:8px">무엇을 물을까요?<textarea id="question" placeholder="판정에 부족한 사실을 적으세요"></textarea></label><button onclick="hold('${id}')">질문 기록하고 보류</button>`;document.getElementById('question').focus();}

function pendingView(d){return `<section class="section"><h3>${d.pending==='manual'?'추출 불확실 → 수기 확정':'짝 보류 → 같은 지출인지 확인'}</h3><div class="notice">정산은 아직 기안되지 않았습니다. 이 화면은 승인 카드가 아니며, 정책 대조와 승인 액션은 열리지 않습니다.</div><p>${d.reason}</p><p><strong>현재 책임자 ${d.owner}</strong> · 증빙 1건 · 사람에게 입력 요청 1건</p>${evidence(d)}
${d.pending==='manual'?`<div class="tablewrap"><table><tr><th>필드</th><th>지면 문자열</th><th>추출값</th><th>상태</th></tr>${d.fx?`<tr><td>한도 대조용 원화 환산</td><td>${fmt(d.convertedReceipt)}<br>${d.receipt} EUR × ${d.fx}원/EUR</td><td>시스템 연동<br><small>모의 환율 자료</small></td><td>교차 확인<br><small>환산 전 금액의 수준</small></td><td>TRV-14-1 · 판 1<br>기준일 ${d.returned} (지출일)<br>매매기준율 정의: 2026년 시행판</td></tr>`:''}<tr><td>거래일</td><td>11/05/26</td><td>${d.confirmedValue||'미확정'}</td><td>${d.resolved?'수기 확정 · 재검산 대기':'날짜 로캘 모호'}</td></tr></table></div><p class="muted">거래일만 판정 입력으로 묻습니다. 합계는 읽었으며 짝이 없으므로 시스템 값으로 대신하지 않습니다. 에이전트 값이 채워지지 않은 입력입니다.</p>`:`<table><tr><th>증빙</th><th>카드 명세 후보</th></tr><tr><td>23,000 JPY · 2026-11-09 · 끝4 2048<br>값의 출처: 에이전트 추출</td><td>150 USD · 2026-11-09 · 끝4 2048<br>값의 출처: 시스템 연동</td></tr></table><p><strong>통화 다름 → 차액 산출하지 않음.</strong> 후보 하나여도 자동 대사 완료가 아닙니다. 값 모순이므로 재무합의자에게 묻습니다.</p>`}
${d.resolved?'<div class="notice">재검산·대사 및 정산 기안 대기. 버튼을 눌렀다고 승인 카드로 우회하지 않습니다.</div>':role===d.owner?`<div class="actionbox">${d.pending==='manual'?'<label>원본에서 확인한 거래일 <input id="manualValue" type="date" aria-label="수기 확정 거래일"></label><p><button class="primary" onclick="resolveInput(\''+d.id+'\')">수기 확정 · 재검산·대사로</button></p>':'<label>같은 지출이라고 판단한 근거<textarea id="pairReason" placeholder="통화가 달라진 이유와 확인한 자료를 적으세요"></textarea></label><button class="primary" onclick="resolveInput(\''+d.id+'\')">같은 지출로 확인 · 대사 불일치</button>'}<p class="muted">입력 화면만 시연합니다. 재검산·대사 엔진과 정산 기안은 실행하지 않습니다.</p></div>`:'<p class="muted">해당 책임자 역할에서만 입력할 수 있습니다.</p>'}</section>${timeView(d)}${auditView(d)}`;}
function resolveInput(id){const d=cases.find(x=>x.id===id);if(role!==d.owner||d.resolved)return;const input=document.getElementById(d.pending==='manual'?'manualValue':'pairReason');if(!input.value.trim()){input.focus();return;}d.resolved=true;if(d.pending==='manual'){d.confirmedValue=input.value;d.state='재검산·대사 대기';d.judgment='거래일 확정 · 재검산·대사 대기';record(d,'수기 확정','에이전트 판독값: 11/05/26 / 미확정 → 사람 확정값: '+input.value+' · 값의 출처: 사람 수기 확정 · 원본 열람: '+(d.originalViewed?'예':'아니오'));}else{d.state='대사 불일치';d.reconciliation='대사 불일치';d.judgment='대사 불일치 · 환산 대기';record(d,'같은 지출로 확인','증빙 23,000 JPY / 카드 원거래 150 USD · 차액 미산출 · 판단 근거: '+input.value+' · 원본 열람: '+(d.originalViewed?'예':'아니오'));}toast='사람의 입력을 기록했습니다. 정책 대조 이전의 대기 상태를 유지합니다.';render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=false;render();return;}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});
render();
</script>
</body>
</html>
