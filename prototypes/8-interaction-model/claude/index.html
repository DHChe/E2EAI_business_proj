<!-- PROTOTYPE — 버리는 코드 (#8) · 상호작용 모델 프로토타입 · claude 레인.
     질문: 승인자가 에이전트와 만나는 표면 — 승인자 큐(척추)와 그 큐에서 열리는 한 건.
     세 안을 ?variant=a|b|c 로 전환한다(하단 고정 바, ←/→ 키). 큐 주인은 ?as=fin|sales|prod.
     합성 데이터 한 벌을 세 안이 같이 그린다. 저장하지 않는다(상태는 메모리에만). 외부 리소스 없음.
     제품 코드가 아니다 — 테스트·추상화·에러 처리 없음. 결정은 사람이 고른 뒤 코디네이터가 반영한다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#8 승인자 큐 — PROTOTYPE (버리는 코드)</title>
<style>
:root{
  --paper:#f4f3ee; --panel:#ffffff; --ink:#1b1b19; --muted:#5f5d56; --faint:#8b887f;
  --line:#d8d5cb; --line2:#ebe9e2;
  --accent:#0e5c55; --accent-soft:#e2eeec;
  --legal:#a3261c; --legal-soft:#f8e4e1;
  --undet:#7a5200; --undet-soft:#f5ead0;
  --pol:#3d4a52; --pol-soft:#e7ebed;
  --pre:#2f4d68; --set:#5b4a1d; --late:#9c2f12;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);padding-bottom:110px}
button{font:inherit;color:inherit}
.proto{background:var(--ink);color:var(--paper);font:600 12px/1.2 var(--mono);padding:7px 16px;letter-spacing:.02em}
.proto span{font-weight:400;opacity:.75;margin-left:10px}
header.top{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:15px;margin:0;font-weight:700}
header.top .who select{font:inherit;padding:3px 6px;border:1px solid var(--ink);border-radius:2px;background:var(--panel)}
header.top .now{font-family:var(--mono);font-size:12px;color:var(--muted)}
header.top .selfcheck{font-size:12px;color:var(--muted);margin-left:auto}
header.top .selfcheck.bad{color:var(--legal);font-weight:700}
#errors{background:var(--legal);color:#fff;font:12px var(--mono);white-space:pre-wrap;padding:6px 16px}
.metrics{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);background:#faf9f5}
.metrics .m{padding:7px 16px;border-right:1px solid var(--line2);font-size:12.5px}
.metrics .m b{font-size:15px;margin-right:4px}
.metrics .m small{display:block;color:var(--faint);font-size:11px}
.metrics .m.warn b{color:var(--legal)}
.axis{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line2);background:var(--panel)}
.axis b{color:var(--ink)}
/* chips */
.chip{display:inline-block;font-size:11.5px;line-height:1.3;padding:1px 6px;border:1px solid var(--line);border-radius:2px;margin:1px 3px 1px 0;white-space:nowrap;background:var(--panel)}
.peak{font-weight:700;border-width:1.5px}
.peak.pre{color:var(--pre);border-color:var(--pre)}
.peak.set{color:var(--set);border-color:var(--set)}
.sig{font-weight:700}
.sig.legal{color:var(--legal);border-color:var(--legal);background:var(--legal-soft)}
.sig.undet{color:var(--undet);border-color:var(--undet);background:var(--undet-soft)}
.sig.pol{color:var(--pol);border-color:var(--pol);background:var(--pol-soft)}
.gate{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.pair{color:var(--ink);border-style:dashed;border-color:var(--ink)}
.mut{color:var(--faint)}
.due{font-family:var(--mono);font-size:12px;font-weight:700}
.due.late{color:var(--late)}
.due.today{text-decoration:underline;text-underline-offset:3px}
.clk{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* clause chip with verbatim popover */
details.cl{display:inline-block;position:relative;vertical-align:baseline}
details.cl>summary{list-style:none;cursor:pointer;font:600 11.5px/1.3 var(--mono);color:var(--accent);border-bottom:1px dotted var(--accent);display:inline}
details.cl>summary::-webkit-details-marker{display:none}
details.cl[open]>summary{background:var(--accent-soft)}
details.cl .quote{position:absolute;z-index:30;left:0;top:1.6em;width:min(520px,80vw);background:var(--panel);border:1px solid var(--ink);padding:8px 10px;box-shadow:0 3px 12px rgba(0,0,0,.15);font-size:12.5px;line-height:1.55;white-space:normal;font-weight:400;color:var(--ink)}
.quote .qh{font:11px var(--mono);color:var(--muted);margin-bottom:4px}
.quote .qt{border-left:3px solid var(--accent);padding-left:8px}
.quote pre{margin:6px 0 0;font:11px/1.45 var(--mono);background:#f6f6f2;padding:6px;overflow:auto}
/* generic card pieces */
.card{background:var(--panel);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 2px}
.sec{border-top:1px solid var(--line2);padding:10px 14px}
.sec>h3{font-size:12px;letter-spacing:.04em;margin:0 0 6px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sec>h3 .h3note{font-weight:400;letter-spacing:0}
.sec.mine{background:#fbfcfb;border-left:3px solid var(--accent)}
.sec.notmine{opacity:.82}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line2);padding:4px 6px;vertical-align:top}
table.t td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.changed td{background:#fff8e6}
tr.unknown td{background:#f3f1ec}
.head{padding:12px 14px}
.head .sub{color:var(--muted);font-size:12.5px}
.linepath{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:8px;font-size:12px}
.linepath .st{border:1px solid var(--line);padding:2px 6px;border-radius:2px;background:var(--panel)}
.linepath .st.done{color:var(--muted)}
.linepath .st.now{border:2px solid var(--ink);font-weight:700}
.linepath .st.me{background:var(--accent-soft)}
.linepath .arr{color:var(--faint);padding:0 2px}
.todo{background:#fbfaf6;border:1px solid var(--ink);margin:10px 14px;padding:10px 12px}
.todo .gl{margin:4px 0 8px;padding-left:18px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--panel);padding:6px 13px;border-radius:3px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.small{padding:2px 8px;font-size:12px;font-weight:500}
.rej-note{font-size:11.5px;color:var(--muted)}
.chain{display:grid;grid-template-columns:minmax(150px,1.1fr) 1.5fr 1.2fr;gap:0;font-size:12.5px;border:1px solid var(--line2)}
.chain>div{padding:5px 8px;border-bottom:1px solid var(--line2)}
.chain .ch{font-weight:600;color:var(--muted);font-size:11.5px;background:#f8f7f3}
.chain .res{font-weight:600}
.headline{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;margin:2px 0 10px;padding:8px 10px;background:#f7f6f1;border-left:3px solid var(--ink)}
.headline .arr{color:var(--faint)}
.cf{font-size:12px;color:var(--muted);margin-top:6px}
.judge{border:1px solid var(--accent);padding:8px 10px;margin:6px 0;background:var(--panel)}
.judge.notmine{border-style:dashed;border-color:var(--faint)}
.judge .q{margin:3px 0;font-size:12.5px}
.judge .q .ans{color:var(--muted)}
.judge .q .ans.none{color:var(--legal)}
.judge textarea,.hold textarea{width:100%;font:12.5px var(--sans);border:1px solid var(--line);padding:4px}
.judge .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sigbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sigbox .slot{border:1px solid var(--line);padding:6px 8px;font-size:12.5px;min-height:44px}
.sigbox .slot.legal.on{border-color:var(--legal);background:var(--legal-soft)}
.sigbox .slot.undet.on{border-color:var(--undet);background:var(--undet-soft)}
.sigbox .slot b{display:block;font-size:12px}
.crop{display:inline-block;font:11px var(--mono);border:1px solid var(--ink);padding:1px 5px;background:#fffdf5}
.orig{margin-top:4px;border:1px dashed var(--muted);padding:6px;font:11px var(--mono);background:#fafaf7;white-space:pre-wrap}
.log{font-size:12px}
.log .ev{display:grid;grid-template-columns:80px 1fr 200px;gap:6px;padding:3px 0;border-bottom:1px solid var(--line2)}
.log .who{font-size:11px}
.tag-agent{font:600 10.5px var(--mono);border:1px solid var(--pol);color:var(--pol);padding:0 4px;border-radius:2px}
.tag-human{font:600 10.5px var(--mono);border:1px solid var(--ink);padding:0 4px;border-radius:2px}
.tag-sys{font:600 10.5px var(--mono);border:1px solid var(--faint);color:var(--faint);padding:0 4px;border-radius:2px}
.hold{border:1px solid var(--ink);padding:8px 10px;margin-top:8px;background:var(--panel)}
.hold label{display:block;font-size:12.5px}
.closure{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.closure b{color:var(--ink)}
.state-strip{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.warn-line{border:1px solid var(--late);color:var(--late);background:#fbefea;padding:6px 8px;margin:4px 0 8px;font-size:12.5px}
.msg{color:var(--legal);font-size:12px;margin-top:4px}
.done-list{padding:8px 12px;font-size:12px;color:var(--muted)}
/* ---------- variant A: 기한 띠 ---------- */
.a-grid{display:grid;grid-template-columns:minmax(340px,38%) 1fr;gap:0;align-items:start}
.a-list{border-right:1px solid var(--line);background:var(--panel);min-height:70vh}
.band{border-bottom:1px solid var(--line)}
.band>.bh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px 4px;font-size:12px;font-weight:700;background:#f8f7f3;border-bottom:1px solid var(--line2)}
.band>.bh .rule{font-weight:400;color:var(--faint);font-size:11px}
.band.late>.bh{color:var(--late)}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:var(--panel);padding:8px 12px;cursor:pointer}
.row:hover{background:#fbfaf6}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .r1,.row .r2,.row .r3{display:block}
.row .r2{margin:2px 0}
.a-detail{padding:14px;min-width:0}
.upc{padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.upc .warn{color:var(--legal);font-weight:600}
/* ---------- variant B: 판단 종류별 섹션 ---------- */
.b-wrap{max-width:1180px;margin:0 auto;padding:12px 16px}
.b-sec{margin-bottom:14px;background:var(--panel);border:1px solid var(--line)}
.b-sec>.bh{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;border-bottom:1px solid var(--line)}
.b-sec>.bh h3{margin:0;font-size:14px}
.b-sec>.bh .def{font-size:12px;color:var(--muted)}
.b-sec.pipeline>.bh{border-left:4px solid var(--legal)}
.b-sec.policy>.bh{border-left:4px solid var(--pol)}
.b-sec.pairs>.bh{border-left:4px solid var(--ink)}
.b-sec.rollup{border-style:dashed}
.b-row{display:grid;grid-template-columns:170px 1fr 280px;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--panel);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.b-row.sel{background:var(--accent-soft)}
.b-open{padding:0 12px 12px;border-bottom:1px solid var(--line);background:#fcfcfa}
.qlist{counter-reset:q;margin:8px 0;padding:0;list-style:none}
.qlist li{counter-increment:q;border:1px solid var(--line);padding:7px 10px 7px 34px;margin-bottom:5px;position:relative;background:var(--panel)}
.qlist li::before{content:counter(q);position:absolute;left:10px;top:7px;font:700 12px var(--mono)}
.qlist li.mine{border-color:var(--accent)}
.qlist li.sig-legal{border-color:var(--legal)}
.qlist li.sig-undet{border-color:var(--undet)}
.qlist li .who{font-size:11.5px;color:var(--muted)}
.satur{font-size:12.5px;padding:8px 12px;background:#fbf7ee;border:1px solid #e3d6b4;margin-bottom:12px}
/* ---------- variant C: 큐 포인터 + 사건 레일 ---------- */
.c-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.c-top .ptr{font:700 18px var(--mono)}
.c-grid{display:grid;grid-template-columns:1fr 290px;gap:14px;padding:14px 16px;align-items:start}
.rail{display:flex;overflow-x:auto;gap:0;padding:10px 0 4px;margin:0 14px 4px}
.rail .node{min-width:128px;max-width:150px;border-top:4px solid var(--line);padding:6px 8px 4px 0;font-size:11.5px;flex:1 0 auto}
.rail .node.done{border-top-color:var(--muted)}
.rail .node.now{border-top-color:var(--ink);border-top-width:6px}
.rail .node.now .nt{font-weight:800}
.rail .node .nt{font-weight:600;font-size:12px}
.rail .node .nd{font-family:var(--mono);color:var(--muted)}
.rail .node .late{color:var(--late);font-weight:700}
.peaks{display:grid;grid-template-columns:120px 1fr 64px 1fr;font-size:12.5px;border:1px solid var(--line2);margin:0}
.peaks>div{padding:4px 8px;border-bottom:1px solid var(--line2)}
.peaks .ph{font-weight:700;background:#f8f7f3}
.peaks .k{color:var(--muted)}
.peaks .mk{font-size:11px;text-align:center}
.peaks .mk.ch{color:var(--set);font-weight:800}
.peaks .mk.un{color:var(--faint)}
.peaks .changed{background:#fff8e6}
.side{background:var(--panel);border:1px solid var(--line)}
.side h4{margin:0;padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
.side .it{padding:6px 10px;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.side .it.cur{background:var(--accent-soft)}
/* ---------- switcher (프로토타입 도구 — 설계 대상 아님) ---------- */
#switcher{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;background:#111;color:#f4f3ee;border-radius:999px;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.28);max-width:96vw;font-size:12px}
#switcher button{background:#f4f3ee;color:#111;border:0;border-radius:999px;width:30px;height:30px;font-weight:800;cursor:pointer}
#switcher .lbl{display:flex;flex-direction:column;min-width:0;padding:0 4px}
#switcher .lbl b{font-size:13px}
#switcher .lbl span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78vw}
@media (max-width:900px){.a-grid,.c-grid{grid-template-columns:1fr}.b-row{grid-template-columns:1fr}.chain{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="proto">PROTOTYPE — 버리는 코드 (#8)<span>합성 데이터 · 한성정밀공업(주) · 새로고침하면 처음 상태 · 제품 코드 아님</span></div>
<div id="errors" hidden></div>
<header class="top">
  <h1>승인자 큐</h1>
  <label class="who">큐 주인 <select id="persona"></select></label>
  <span class="now" id="now"></span>
  <span class="selfcheck" id="selfcheck">자체 점검 전</span>
</header>
<div class="metrics" id="metrics"></div>
<main id="app"></main>
<div id="switcher" aria-label="프로토타입 안 전환(설계 대상 아님)">
  <button id="sw-prev" title="이전 안 (←)">←</button>
  <div class="lbl"><b id="sw-name"></b><span id="sw-axis"></span><span id="sw-state"></span></div>
  <button id="sw-next" title="다음 안 (→)">→</button>
</div>
<noscript>이 프로토타입은 JavaScript가 필요하다(외부 리소스는 없다).</noscript>
<script>

window.addEventListener('error', function (e) {

});

/* =====================================================================
   1. 규정 원문 — docs/company/*.md 에서 축자로 가져온 발췌(마크다운 강조만 뺐다).

    const d5 = bizBefore(doc.trip.depart, LIM5[doc.type]), late = doc.drafted > d5;
    out.push({ cl: 'PRC-5-1', what: '사전승인 기안', owner: '기안자', due: d5, done: doc.drafted, st: late ? '경과' : '지킴' });

    } else out.push({ cl: 'PRC-6-1', what: '사전승인 완료', owner: '결재선 전체', due: d6, st: '열림' });

    const d10 = bizAfter(doc.trip.ret, 10);

      const d0 = bizAfter(h.firstArr, 3);
      out.push({ cl: 'PRC-14-1', what: `${who} 처리(첫 도달 ${md(h.firstArr)})`, owner: who, due: d0, done: h.held, st: h.held <= d0 ? '지킴' : '경과', note: '보류로 처리' });

function docDue(doc) {

/* 시계 부족: 남은 결재자가 각자 PRC-14-1을 끝까지 쓰면 완료 기한을 넘는가 */

const curIdx = d => d.history.length - 1;
const curWho = d => calc(d).line[curIdx(d)];
const persona = () => PERSONAS.find(x => x.id === S.p);
const whoName = w => w + (NAMED[w] ? ' ' + NAMED[w] : '');
function byDue(a, b) { const x = docDue(a), y = docDue(b); const u = x ? x.due : '9999', v = y ? y.due : '9999'; return u < v ? -1 : u > v ? 1 : a.id < b.id ? -1 : 1; }
function queue(pid) {
  const who = PERSONAS.find(x => x.id === pid).who, mine = DOCS.filter(d => curWho(d) === who);
  return { who, open: mine.filter(d => ST[d.id].status === '열림').sort(byDue), held: mine.filter(d => ST[d.id].status === '보류'),
    done: mine.filter(d => ST[d.id].status === '처리함'),
    upcoming: DOCS.filter(d => calc(d).line.indexOf(who) > curIdx(d)).sort(byDue) };
}
function sig(doc) {

    pairOpen: ev.filter(e => e.recon === '짝 보류' && !ST[doc.id].pair[e.id]) };
}
const discWho = (doc, cl) => DISC[cl].by === '재무합의자' ? '재무팀 담당자' : calc(doc).title;
function gates(doc, who) {

    const r = ST[doc.id].judg[x.cl];
    if (discWho(doc, x.cl) === who && !(r && r.eff === 'ok')) g.push(`${x.cl} 재량 판단을 기록하지 않았다 — 판단 책임자가 이 큐의 주인이다`);
  });

}
const TF = [['출발일', 'depart', '일정'], ['복귀일', 'ret', '일정'], ['업무일 수', 'workdays', '일정'], ['비업무일 수', 'nonwork', '일정'],
  ['숙박 밤 수', 'nights', '일정'], ['좌석', 'seat', '좌석'], ['숙소', 'lodging', '숙소'], ['동행자', 'companion', '동행'], ['사적 일정', 'private', '사적 일정']];

  const lb = it => it.upperGrade ? `TRV-7-1 적용 청구(동행 ${it.upperGrade} 상한)` : `TRV-6-2 본인 직급(${PEOPLE[doc.person].grade})`;
  const la = pre.items.find(i => i.kind === 'lodging'), lbb = doc.items.find(i => i.kind === 'lodging');

function policySignals(doc) {

function cite(id) {

function clChip(id, full) {

const peakChip = d => `<span class="chip peak ${d.peak === '사전승인' ? 'pre' : 'set'}">${d.peak}</span>`;
function stateLabel(doc, P) {

  ];
  return `<div class="todo"><b>${P.role}로서 볼 것</b> ${clChip(fin ? 'APV-10-1' : 'APV-10-2')} <span class="mut">· 같은 사항을 두 역할이 다시 판단하지 않는다 ${clChip('APV-10-3')}</span>
    <ol class="gl">${scope.map(x => `<li>${x}</li>`).join('')}</ol>
    ${g.length ? `<div><b>${fin ? '동의' : '승인'} 전에 남은 것</b></div><ul class="gl">${g.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    <div class="actions">
      <button class="btn primary" data-act="approve" data-id="${doc.id}" ${g.length ? 'disabled' : ''}>${fin ? '동의' : '승인'}</button>
      <button class="btn" data-act="hold-open" data-id="${doc.id}">보류 — 질문 보내기</button>
      <button class="btn" disabled title="반려 흐름은 #17에서 정한다">반려</button><span class="rej-note">#17 대기</span>
    </div>
    ${S.holdFor === doc.id ? holdForm(doc, P) : ''}</div>`;
}

function secSig(doc, P) {
  if (!doc.ev) return `<div class="sec"><h3>주의 신호 <span class="h3note">사전승인에는 증빙이 없다 — 파이프라인 신호 해당 없음</span></h3></div>`;
  const s = sig(doc);
  const slot = (cls, name, arr) => `<div class="slot ${cls} ${arr.length ? 'on' : ''}"><b>${name} ${arr.length}</b>${arr.map(e => `${e.what} — ${e.legalWhy}`).join('<br>') || '<span class="mut">없음</span>'}</div>`;
  return `<div class="sec ${P.role === '재무합의자' ? 'mine' : ''}"><h3>주의 신호 <span class="h3note">파이프라인이 올리는 두 종류 · 지출 단위 · 두 칸을 합치지 않는다</span></h3>
    <div class="sigbox">${slot('legal', '법적 하자', s.legal)}${slot('undet', '판정 불가', s.undet)}</div>
    ${s.legal.length ? '<div class="cf">법적 하자를 누가 어떻게 처리하는지 정한 조항은 없다(APV-10-1 제1호는 사내 증빙 PRC-12다) — 열린 질문.</div>' : ''}</div>`;
}

function exNote(doc, c, r) {
  if (!r.excess) return '';
  if (!r.exClaim) return `본인 부담 ${clChip('TRV-11-1')}`;
  if (c.covered) return `한도 초과 청구 — 사전승인에서 인정된 ${won(LINKED[doc.pre].decided.amount)} 안이라 다시 한도 초과 청구로 보지 않는다 ${clChip('TRV-12-3')} ${clChip('APV-7-3')}`;
  return `한도 초과 청구 ${clChip('TRV-12-1')} — 지급 여부는 올라간 결재권자가 정한다 ${clChip('TRV-12-2')}`;
}
function secPolicy(doc, P) {
  const c = calc(doc), pre = doc.pre ? LINKED[doc.pre] : null, fin = P.role === '재무합의자';
  const rows = c.rows.map(r => `<tr><td>${r.k}</td><td class="num">${won(r.claim)}</td><td>${r.ref ? clChip(r.ref) : ''}${r.ref2 ? ' ' + clChip(r.ref2) : ''} ${r.how}</td><td class="num">${won(r.within)}</td><td class="num">${r.excess ? won(r.excess) : ''}</td><td>${exNote(doc, c, r)}</td></tr>`).join('');
  const noUp = c.reasons.length ? calc(doc, { noUp: true }) : null;
  const chain = [
    ['청구 총액', `${won(c.total)} — ${doc.peak === '사전승인' ? '예상액' : '청구액'} ${clChip('APV-5-1')}`, `총액 단계 <b>${c.tStep}</b> ${clChip('APV-5-2')}`],
    ['한도 적용 금액', `${won(c.within)} ${clChip('TRV-3-7')}`, `단계 ${c.lStep0}${c.reasons.length ? ` → 상향 사유 ${c.reasons.map(r => r.id + ' ' + clChip(r.ref)).join(', ')} → 한 단계 올려 <b>${c.lStep}</b> ${clChip('APV-7-1')}` : ' · 상향 사유 없음'}${c.covered ? ` · 사전 인정 안의 초과는 상향 사유가 아니다 ${clChip('APV-7-3')}` : ''}`],
    ['기준 단계', `max(${c.tStep}, ${c.lStep}) — 더하지 않는다`, `<b>${c.baseStep}</b> ${clChip('APV-7-4')}`]
  ];
  if (pre) chain.push(['정산 하한', `사전승인 전결권자 ${c.floorTitle}(${c.floor})`, `${c.level}${LV.indexOf(c.floor) > LV.indexOf(c.baseStep) ? ' — 하한이 올렸다' : ' — 하한 이상'} ${clChip('APV-7.2-1')}`]);
  if (c.selfUp) chain.push(['자기 결재 금지', '기안자가 그 단계 직책자', `한 단계 위 ${clChip('APV-8-2')}`]);
  chain.push(['전결권자', c.reasons.length ? `상향이 없었다면 ${noUp.title}` : '', `<b>${c.title}</b>${c.reasons.length && noUp.title !== c.title ? ' — 한 단계 올라왔다' : ''}`]);
  if (c.fin.length) chain.push(['재무합의', `청구 총액 ${won(c.total)} ${c.total > 5000000 ? '> 5,000,000' : '≤ 5,000,000'}`, `${c.fin.map(whoName).join(' → ')} ${clChip('APV-9-2')} · 기안자와 첫 결재자 사이 ${clChip('APV-9-1')}`]);
  chain.push(['결재선', `기안 시점에 확정 ${clChip('APV-11-1')}`, c.line.map(whoName).join(' → ')]);
  const lead = c.reasons.length ? c.reasons.map(r => `${clChip(r.ref, true)} ${r.id}`).join(' · ') : clChip('APV-5-2', true);
  return `<div class="sec ${fin ? 'notmine' : ''}"><h3>정책 대조 <span class="h3note">별도 구획 — 주의 신호가 아니다 · 조항 → 계산 → 결재선 · 조항을 누르면 원문</span></h3>
    <div class="headline">${lead}<span class="arr">→</span>한도 적용 금액 ${won(c.within)} · 청구 총액 ${won(c.total)}${c.exClaim ? ` · 초과분 ${won(c.exClaim)}` : ''}<span class="arr">→</span>기준 단계 ${c.baseStep}${pre ? ` · 하한 ${c.floor}` : ''}<span class="arr">→</span>결재선 ${c.line.map(whoName).join(' → ')}</div>
    <table class="t"><tr><th>항목</th><th>청구</th><th>한도 근거와 계산</th><th>한도 적용</th><th>초과분</th><th>초과분의 처리</th></tr>${rows}
      <tr><td><b>합계</b></td><td class="num"><b>${won(c.total)}</b></td><td></td><td class="num"><b>${won(c.within)}</b></td><td class="num">${c.exClaim ? won(c.exClaim) : ''}</td><td>${c.self ? `본인 부담 ${won(c.self)}` : ''}</td></tr></table>
    ${doc.seatNote ? `<div class="cf">좌석: ${doc.seatNote} ${clChip('TRV-8-1')} ${clChip('TRV-8-2')}</div>` : ''}
    <div class="chain" style="margin-top:8px"><div class="ch">단계</div><div class="ch">입력</div><div class="ch">결과와 조항</div>${chain.map(r => `<div>${r[0]}</div><div>${r[1]}</div><div class="res">${r[2]}</div>`).join('')}</div>
    ${fin ? '<div class="cf">재무합의자에게 이 구획은 읽기용이다 — 결재선 판단은 재무합의자의 검토 범위가 아니다.</div>' : ''}</div>`;
}

function branchTable(doc, cl) {
  const opts = DOPT[cl].filter(o => o.opt);
  if (!opts.length) return '';
  const cs = opts.map(o => calc(doc, o.opt)), same = cs.every(c => c.title === cs[0].title);
  return `<table class="t" style="margin-top:6px"><tr><th>판단</th><th>총액</th><th>한도 적용 금액</th><th>전결권자</th><th>지급에 미치는 것</th></tr>${opts.map((o, i) => `<tr><td>${o.k}</td><td class="num">${won(cs[i].total)}</td><td class="num">${won(cs[i].within)}</td><td>${cs[i].title}</td><td>${o.pay ? o.pay(cs[i]) : ''}</td></tr>`).join('')}</table>
    <div class="cf">결재선은 기안 시점에 확정되어 바뀌지 않는다 ${clChip('APV-11-1')} — ${same ? '이 건은 어느 판단이든 전결권자가 같다.' : '판단에 따라 계산상 전결권자가 달라진다 — 충돌.'}</div>`;
}
function judgeBlock(doc, P, x) {
  const d = DISC[x.cl], who = discWho(doc, x.cl), st = ST[doc.id], rec = st.judg[x.cl];
  const mine = who === P.who && curWho(doc) === P.who && st.status === '열림';
  const qs = d.ask.map(q => { const a = x.answers[q]; return `<div class="q">묻는 사실: ${q}<br><span class="ans ${a ? '' : 'none'}">${a ? '답: ' + a : '답 없음'}</span></div>`; }).join('');
  const opts = DOPT[x.cl].map((o, i) => o.eff === '17'
    ? `<button class="btn small" disabled title="${o.why}">${o.k}</button><span class="rej-note">#17 대기 — ${o.why}</span>`
    : `<button class="btn small${o.eff === 'ok' ? ' primary' : ''}" data-act="judge" data-id="${doc.id}" data-cl="${x.cl}" data-i="${i}" ${mine ? '' : 'disabled'}>${o.k}</button>`).join(' ');
  const assume = x.cl === 'TRV-12-1' ? ` — 올라간 결재권자 ${clChip('TRV-12-2')}` : d.by === '결재권자' ? ' <span class="mut">(결재권자가 여럿일 때 누구인지 조항이 말하지 않는다 — 전결권자로 가정)</span>' : '';
  return `<div class="judge ${mine || rec ? '' : 'notmine'}">
    <div>${clChip(x.cl, true)} — 기준: “${d.basis}”</div>
    <div class="q"><b>에이전트가 모은 근거</b> <span class="mut">(${d.evidence.join(' · ')})</span><ul class="gl">${x.agentEvidence.map(t => `<li>${t}</li>`).join('')}</ul></div>
    ${qs}
    <div class="q">판단 책임자: <b>${d.by}</b> → ${whoName(who)}${assume} ${who === P.who ? '<span class="chip gate">내 몫</span>' : `<span class="chip mut">내 몫 아님 — 다시 판단하지 않는다 · APV-10-3</span>`}</div>
    <div class="q mut">에이전트가 정하지 않는 것: ${d.never.join(' · ')}</div>
    ${x.cl === 'PRC-13-5' ? `<div class="q">동의하려면 남길 것 — 미확인 쟁점 · 검토 자료(위 근거에서 채움) · 사내 지급 인정 이유 · 책임자(${whoName(who)}). 동의해도 법정 판정은 <b>판정 불가</b>로 남는다.</div>` : branchTable(doc, x.cl)}
    ${rec ? `<div class="q"><b>기록됨:</b> ${rec.k} — 행위자·책임자 ${rec.by}${rec.note ? ' · 이유: ' + rec.note : ''}</div>`
      : `${mine ? `<textarea rows="2" placeholder="${x.cl === 'PRC-13-5' ? '사내 지급 인정 이유(필수 — PRC-13-5)' : '판단 이유(선택)'}"></textarea>` : ''}<div class="opts">${opts}</div>`}
  </div>`;
}
function secDisc(doc, P) {
  if (!doc.disc) return '';
  return `<div class="sec"><h3>재량 판단 <span class="h3note">규칙으로 연역되지 않는 자리 — 에이전트는 사실을 모으고 판단하지 않는다 · 정책 대조 구획의 일부</span></h3>${doc.disc.map(x => judgeBlock(doc, P, x)).join('')}</div>`;
}

function secDiff(doc, P) {
  const fin = P.role === '재무합의자';
  if (doc.peak === '사전승인') return `<div class="sec"><h3>사전승인과 정산의 차이 <span class="h3note">이 문서는 사전승인이다</span></h3><div class="cf">정산은 복귀일 ${md(doc.trip.ret)}부터 10영업일 이내, ${md(bizAfter(doc.trip.ret, 10))} 18:00까지 기안한다 ${clChip('PRC-10-1')}. 그때 이 문서가 대조 기준이 된다.</div></div>`;
  const rows = diffRows(doc), shown = rows.filter(r => r.st !== 'same'), same = rows.filter(r => r.st === 'same');
  const tr = r => `<tr class="${r.st === 'changed' ? 'changed' : r.st === 'unknown' ? 'unknown' : ''}"><td>${r.lab}</td><td class="${r.money ? 'num' : ''}">${r.a == null ? '<i>사전승인에 없음</i>' : r.money ? won(r.a) : r.a}</td><td class="${r.money ? 'num' : ''}">${r.b == null ? '—' : r.money ? won(r.b) : r.b}</td><td>${r.st === 'changed' ? '바뀜' : r.st === 'unknown' ? '<b>알 수 없음</b>(변경 없음이 아니다)' : '같음'}</td><td>${r.why}</td></tr>`;
  return `<div class="sec ${fin ? 'notmine' : 'mine'}"><h3>사전승인과 정산의 차이 <span class="h3note">${fin ? '결재권자 몫' : '내 몫'} ${clChip('APV-10-2')} · 바뀜 ${rows.filter(r => r.st === 'changed').length} · 알 수 없음 ${rows.filter(r => r.st === 'unknown').length} · 출장 중 변경은 정산 문서에 적는다 ${clChip('PRC-9-1')}</span></h3>
    <table class="t"><tr><th>필드</th><th>사전승인</th><th>정산</th><th></th><th>기안자가 적은 사유</th></tr>${shown.map(tr).join('') || '<tr><td colspan="5">모든 필드가 같다 — 차이 없음</td></tr>'}</table>
    ${same.length ? `<details><summary class="cf">같은 값 ${same.length}개 펼치기</summary><table class="t">${same.map(tr).join('')}</table></details>` : ''}</div>`;
}

function pairCtl(doc, P, e) {
  if (e.recon !== '짝 보류') return '';
  const st = ST[doc.id], v = st.pair[e.id];
  if (v) return `<div><b>짝 확인: ${v}</b> — 행위자·책임자 ${whoName(P.who)}</div>`;
  const can = P.role === '재무합의자' && e.pairOwner === '재무합의자' && curWho(doc) === P.who && st.status === '열림';
  return `<div class="mut">${e.reconHow}<br>짝 확인 담당: ${e.pairOwner}</div>${can ? `<div class="opts">${['대사 완료', '대사 불일치', '짝 없음'].map(x => `<button class="btn small" data-act="pair" data-id="${doc.id}" data-ev="${e.id}" data-v="${x}">${x}로 닫기</button>`).join(' ')}</div>` : ''}`;
}
function secEv(doc, P) {
  if (!doc.ev) return `<div class="sec"><h3>지출과 증빙 <span class="h3note">사전승인은 예상액이라 증빙이 없다</span></h3></div>`;
  const st = ST[doc.id], fin = P.role === '재무합의자';
  const rows = doc.ev.map(e => `<tr><td>${e.what}<div class="mut">${e.item} · ${e.pay}</div>${e.note ? `<div class="mut">${e.note}</div>` : ''}${(e.routed || []).map(r => `<span class="chip">${r === 'H11' ? '주의 신호' : r}</span>`).join('')}</td>
    <td class="num">${e.orig}<br>${won(e.krw)}원</td>
    <td>${e.recon === '짝 보류' ? '<b>짝 보류</b>' : e.recon}${e.recon !== '짝 보류' && e.reconHow ? `<div class="mut">${e.reconHow}${e.reconBy ? ' · 행위자 ' + e.reconBy : ''}</div>` : ''}${pairCtl(doc, P, e)}</td>
    <td><b style="color:${/미충족/.test(e.legal) ? 'var(--legal)' : e.legal === '판정 불가' ? 'var(--undet)' : 'inherit'}">${e.legal}</b><div class="mut">${e.legalWhy}</div></td>
    <td>${e.fields.map(f => `<div>${f[0]}: <b>${f[1]}</b> <span class="mut">· ${f[2]} · ${f[3]}</span></div>`).join('')}</td>
    <td><span class="crop">${e.crop}</span><details class="origd" data-id="${doc.id}" data-ev="${e.id}"><summary class="cf">원본 펼치기</summary><div class="orig">[합성 원본 자리 — 이미지 없음]\n${e.what}\n${e.crop}\n결제: ${e.pay}</div></details></td></tr>`).join('');
  const routed = doc.ev.filter(e => (e.routed || []).length).length;
  const manual = doc.ev.filter(e => (e.routed || []).includes('수기 확정'));
  return `<div class="sec ${fin ? 'mine' : 'notmine'}"><h3>지출과 증빙 <span class="h3note">${fin ? '재무합의자 몫' : '재무합의자가 본 것 — 결재권자는 다시 판단하지 않는다'} · ${doc.ev.length}건 · 원본 열람 <span data-origcount="${doc.id}">${Object.keys(st.orig).length}</span>/${doc.ev.length} · 값의 출처와 검증 수준은 필드마다</span></h3>
    <table class="t"><tr><th>지출</th><th>금액</th><th>대사 결과</th><th>수취 의무 판정</th><th>필드 · 값의 출처 · 검증 수준</th><th>크롭 · 원본</th></tr>${rows}</table>
    <div class="closure"><span>사람에게 보낸 지출 <b>${routed}/${doc.ev.length}</b></span><span>나머지는 사람 손을 거치지 않았다</span>
      ${manual.length ? `<span>추출 불확실 ${manual.length}건 — 상신 전에 기안자가 수기 확정해 닫혔다. 추출 불확실은 승인 카드에 열린 채로 오지 않는다</span>` : '<span>추출 불확실 없음(있었다면 상신 전에 닫혔다)</span>'}</div></div>`;
}

function secLog(doc, P) {
  const c = calc(doc), p = PEOPLE[doc.person], L = [];
  const H = (t, w) => `<span class="tag-human">사람</span> ${t} ${w}`;
  (doc.ev || []).forEach(e => {
    if (e.reconBy) L.push(['상신 전', `짝 확인 — ${e.what}: 대사 완료`, H('행위자·책임자', e.reconBy)]);
    if ((e.routed || []).includes('수기 확정')) L.push(['상신 전', `수기 확정 — ${e.what}의 통화(추출 불확실)`, H('행위자·책임자', p.name)]);
  });
  L.push([md(doc.drafted), '기안 · 상신', H('행위자·책임자', p.name)]);
  L.push([md(doc.drafted), '정책 대조 계산 · 결재선 확정', '<span class="tag-agent">에이전트</span> 계산 — 결정 아님']);
  doc.history.forEach((h, j) => {
    const w = whoName(c.line[j]);
    if (h.firstArr) {
      L.push([md(h.firstArr), `도달 — ${w}`, '<span class="tag-sys">시스템</span>']);
      L.push([md(h.held), '보류 — 판정에 부족한 사실 질문(PRC-13-4)', H('행위자·책임자', w)]);
      L.push([md(h.answered), '답변', H('행위자', '기안자 ' + p.name)]);

}

function card(doc, P, mode) {
  if (mode === 'c') return `<div class="card">${secHead(doc, P)}${rail(doc, P)}${peaks(doc)}${secTodo(doc, P)}${secSig(doc, P)}${secPolicy(doc, P)}${secDisc(doc, P)}${secEv(doc, P)}${secLog(doc, P)}</div>`;
  if (mode === 'b') return `<div class="card">${secHead(doc, P)}${secDue(doc)}${secSig(doc, P)}${secPolicy(doc, P)}${secDiff(doc, P)}${secEv(doc, P)}${secLog(doc, P)}</div>`;
  return `<div class="card">${secHead(doc, P)}${secTodo(doc, P)}${secDue(doc)}${secSig(doc, P)}${secPolicy(doc, P)}${secDisc(doc, P)}${secDiff(doc, P)}${secEv(doc, P)}${secLog(doc, P)}</div>`;

/* =====================================================================
   10. 안 B — 판단 종류별 섹션 + 롤업 (정책 대조를 주의 신호로 친 경우의 시연)
   ===================================================================== */
const BSEC = [

  { k: 'pairs', h: '짝 확인', def: '짝 보류가 열려 있는 문서', test: d => d.ev && sig(d).pairOpen.length },
  { k: 'policy', h: '정책 신호 — 이 안이 새로 친 신호', def: '한도 초과 청구 · 결재선 상향 · 재량 조항 · 사전승인과 정산의 차이 — 문서 단위', test: d => policySignals(d).length },
  { k: 'rollup', h: '신호 없음 — 롤업', def: '일괄 승인 없음: 결재권자는 업무상 필요를 한 건씩 본다(APV-10-2 제1호) · 재무합의자도 대사 결과를 한 건씩 본다', test: () => true }
];
function questions(doc, P) {
  const qs = [], fin = P.role === '재무합의자', s = sig(doc), c = calc(doc), dr = diffRows(doc);
  s.legal.forEach(e => qs.push({ cls: 'sig-legal', mine: fin, t: `법적 하자 — ${e.what}: 치유를 요청할 것인가?`, sub: e.legalWhy, who: '처리 조항 없음 — 재무합의자가 본다고 가정' }));
  s.undet.forEach(e => qs.push({ cls: 'sig-undet', mine: fin, t: `판정 불가 — ${e.what}: 제출된 자료가 실제 지출과 업무 관련성을 충분히 뒷받침하는가?`, sub: e.legalWhy, who: '재무합의자 · PRC-13-5' }));
  s.pairOpen.forEach(e => qs.push({ cls: '', mine: fin, t: `짝 확인 — ${e.what}: 같은 거래인가?`, sub: e.reconHow, who: e.pairOwner, pair: e }));
  (doc.disc || []).filter(x => x.cl !== 'PRC-13-5').forEach(x => qs.push({ cls: '', mine: discWho(doc, x.cl) === P.who, t: `재량 — ${DISC[x.cl].basis}에 해당하는가?`, who: whoName(discWho(doc, x.cl)) + ' · ' + x.cl, disc: x }));
  (doc.disc || []).filter(x => x.cl === 'PRC-13-5').forEach(x => qs.push({ cls: '', mine: fin, t: '판정 불가인 지출에 사내 지급을 인정할 근거가 충분한가?', who: '재무합의자 · PRC-13-5', disc: x }));
  if (c.exClaim && !c.covered) qs.push({ cls: '', mine: false, info: true, t: `한도 초과 청구 ${won(c.exClaim)} 때문에 결재선이 한 단계 올라왔다 — 전결권자 ${c.title}`, who: '정보 · APV-7-1' });
  if (c.reasons.some(r => r.ref === 'PRC-4-1')) qs.push({ cls: '', mine: false, info: true, t: `사전승인 완료 전 출발 — 결재선이 한 단계 올라왔다(전결권자 ${c.title})`, who: '정보 · APV-7-1 제2호' });
  if (dr && dr.some(r => r.st !== 'same')) qs.push({ cls: '', mine: !fin, t: `사전승인과 정산의 차이 ${dr.filter(r => r.st === 'changed').length}개(알 수 없음 ${dr.filter(r => r.st === 'unknown').length})와 그 사유를 받아들이는가?`, who: '결재권자 · APV-10-2 제2호' });
  if (!fin) qs.push({ cls: '', mine: true, t: '출장과 지출의 업무상 필요가 있는가?', who: '결재권자 · APV-10-2 제1호' });
  pastLate(doc).forEach(k => qs.push({ cls: '', mine: false, info: true, t: `기한 경과 이력 — ${k.what} ${md(k.due)} 18:00 (${k.cl})`, who: '정보 · PRC-15-1' }));

function bOpen(doc, P) {

    <ol class="qlist">${qs.map(q => `<li class="${q.cls} ${q.mine ? 'mine' : ''}"><div>${q.t}${q.info ? ' <span class="chip mut">정보</span>' : q.mine ? ' <span class="chip gate">내 몫</span>' : ' <span class="chip mut">내 몫 아님</span>'}</div>${q.sub ? `<div class="who">${q.sub}</div>` : ''}<div class="who">판단: ${q.who}</div>${q.disc ? judgeBlock(doc, P, q.disc) : ''}${q.pair ? pairCtl(doc, P, q.pair) : ''}</li>`).join('')}</ol>
    ${secTodo(doc, P)}
    <details><summary class="cf">카드 전체 펼치기 — 기한 · 정책 대조 · 차이 · 증빙 · 기록</summary>${card(doc, P, 'b')}</details></div>`;

function renderB(P) {
  const q = queue(S.p), placed = {}, all = q.open;
  const secs = BSEC.map(s => { const ds = all.filter(d => !placed[d.id] && s.test(d)); ds.forEach(d => { placed[d.id] = s.k; }); return { s, ds }; });
  const pol = secs.find(x => x.s.k === 'policy').ds.length, roll = secs.find(x => x.s.k === 'rollup').ds.length;

    ${body}

    <section class="b-sec"><div class="bh"><h3>다가오는 건 · ${q.upcoming.length}</h3><span class="def">아직 내 차례 아님</span></div>${upcomingHtml(q)}</section></div>`;

/* =====================================================================
   11. 안 C — 큐 포인터 + 사건 레일 (한 번에 한 건, 시간 축은 문서 안에)
   ===================================================================== */
function rail(doc, P) {
  const c = calc(doc), ks = clocks(doc), pre = doc.pre ? LINKED[doc.pre] : null, N = [];
  if (pre) { N.push({ t: '사전승인 기안', d: pre.drafted, s: 'done' }); N.push({ t: '사전승인 완료', d: pre.completed, s: 'done', x: doc.departedBeforeComplete ? '<span class="late">출발 뒤 완료</span>' : '' }); }
  N.push({ t: '출발', d: doc.trip.depart, s: doc.trip.depart <= NOW ? 'done' : '' });
  N.push({ t: '복귀', d: doc.trip.ret, s: doc.trip.ret <= NOW ? 'done' : '' });
  ks.forEach(k => {
    if (k.cl === 'PRC-16-1') return;
    const lab = k.cl === 'PRC-14-1' ? `${k.owner === P.who ? '나' : k.owner} 처리 기한` : `${k.what} 기한`;
    N.push({ t: lab, d: k.due, s: k.st === '열림' ? 'open' : 'done', cl: k.cl, x: k.st === '경과' ? `<span class="late">경과${k.done ? ' · ' + md(k.done) : ''}</span>` : k.st === '열림' ? `<b>${dueTxt(k.due)}</b>` : k.st + (k.done ? ' · ' + md(k.done) : '') });
  });
  N.push({ t: '기안', d: doc.drafted, s: 'done' });
  for (let j = doc.history.length; j < c.line.length; j++) N.push({ t: `${c.line[j]} 도달`, d: null, s: '', x: '아직' });
  if (doc.peak === '사전승인') N.push({ t: '정산 기안 기한', d: bizAfter(doc.trip.ret, 10), s: '', cl: 'PRC-10-1', x: '복귀 뒤' });
  else N.push({ t: '지급 기한', d: null, s: '', cl: 'PRC-16-1', x: '완료일부터 5영업일' });
  N.push({ t: '지금', d: NOW, s: 'now', x: NOWTIME + ' KST' });
  N.sort((a, b) => (a.d || '9999') < (b.d || '9999') ? -1 : (a.d || '9999') > (b.d || '9999') ? 1 : 0);
  return `<div class="rail">${N.map(n => `<div class="node ${n.s === 'now' ? 'now' : n.s === 'done' ? 'done' : ''}"><div class="nt">${n.t}</div><div class="nd">${n.d ? md(n.d) : '—'}</div>${n.cl ? `<div>${clChip(n.cl)}</div>` : ''}${n.x ? `<div>${n.x}</div>` : ''}</div>`).join('')}</div>
    ${shortage(doc) ? `<div style="margin:0 14px">${secDueWarn(doc)}</div>` : ''}`;
}
function secDueWarn(doc) { const sh = shortage(doc); return `<div class="warn-line"><b>시계 부족</b> — ${sh.path.join(' → ')}: ${sh.lim.what} 기한 ${md(sh.lim.due)} 18:00을 넘을 수 있다. 출발 전 미완료면 정산에 상향 사유 ${clChip('PRC-4-1')}.</div>`; }
function peaks(doc) {

/* =====================================================================

const VARS = {
  a: { name: '안 A — 기한 띠 목록 (권고)', axis: '정렬·묶음: 문서의 기한(열린 기한 중 가장 이른 것 · PRC-3-5)을 18:00 경계 띠로 묶는다. 신호·재량은 줄 안의 표시일 뿐 순서를 바꾸지 않는다.' },
  b: { name: '안 B — 판단 종류별 섹션 + 롤업', axis: '묶음: 판단 종류(파이프라인 주의 신호 → 짝 확인 → 정책 신호 → 신호 없음 롤업). 구획 안은 기한순. 정책 대조를 신호로 친 경우의 시연.' },
  c: { name: '안 C — 큐 포인터 + 사건 레일', axis: '축: 큐 포인터 — 한 번에 한 건, 다음 건은 기한순. 시간 축은 목록이 아니라 문서 안의 사건 레일에 있다.' }
};
const S = { v: 'a', p: 'prod', sel: {}, holdFor: null };
const qp = new URLSearchParams(location.search);
if (VARS[qp.get('variant')]) S.v = qp.get('variant');
if (PERSONAS.some(x => x.id === qp.get('as'))) S.p = qp.get('as');

function metrics(P) {
  const q = queue(S.p), all = q.open.concat(q.held, q.done);
  let ex = 0, routed = 0, legal = 0, undet = 0;
  all.forEach(d => (d.ev || []).forEach(e => { ex++; if ((e.routed || []).length) routed++; if (/미충족/.test(e.legal)) legal++; if (e.legal === '판정 불가') undet++; }));
  const bc = { late: 0, today: 0, next: 0 };
  q.open.forEach(d => { const x = docDue(d); if (x && band(x.due) in bc) bc[band(x.due)]++; });
  const discMine = q.open.reduce((n, d) => n + (d.disc || []).filter(x => discWho(d, x.cl) === q.who && !ST[d.id].judg[x.cl]).length, 0);
  const m = (b, t, s, cls) => `<div class="m ${cls || ''}"><b>${b}</b>${t}<small>${s}</small></div>`;
  let h = m(q.open.length, '건 내 차례', `답변 대기 ${q.held.length} · 처리함 ${q.done.length} · 다가오는 건 ${q.upcoming.length}`)
    + m(bc.late, '건 기한 경과', '표시만 · PRC-15-2', bc.late ? 'warn' : '')
    + m(bc.today, '건 오늘 18:00', '') + m(bc.next, '건 다음 영업일', '')
    + m(`${routed}/${ex}`, ' 사람에게 보낸 지출', '수기 확정 ∪ 짝 확인 ∪ 주의 신호 · 지출 단위 · 이 큐 안에서만 센 값')
    + m(`${legal} · ${undet}`, ' 주의 신호', '법적 하자 · 판정 불가 — 따로 센다')
    + m(discMine, '건 내 몫 재량 판단', S.v === 'b' ? '이 안에서는 정책 신호로 센다' : '정책 대조 구획 — 신호로 세지 않는다');
  if (S.v === 'b') { const pa = all.filter(d => policySignals(d).length).length; h += m(`${pa}/${all.length}`, ' 정책 신호 붙은 문서', '문서 단위 — 지출 단위 R2와 같은 분모에 못 넣는다', 'warn'); }
  return h;
}
function ensureSel() {
  const q = queue(S.p), mine = q.open.concat(q.held, q.done);
  if (!mine.some(d => d.id === S.sel[S.p])) S.sel[S.p] = q.open.length ? q.open[0].id : mine.length ? mine[0].id : null;
}
function syncUrl() { try { const u = new URL(location.href); u.searchParams.set('variant', S.v); u.searchParams.set('as', S.p); history.replaceState(null, '', u); } catch (e) { /* file:// 에서 막히면 무시 */ } }
function render() {
  const P = persona(); ensureSel();
  document.getElementById('now').textContent = `지금(시뮬레이션) ${NOW} ${md(NOW).slice(-3)} ${NOWTIME} KST · 가정 달력`;
  document.getElementById('metrics').innerHTML = metrics(P);
  document.getElementById('app').innerHTML = `<div class="axis"><b>${VARS[S.v].name}</b> · ${VARS[S.v].axis}</div>` + (S.v === 'a' ? renderA(P) : S.v === 'b' ? renderB(P) : renderC(P));
  const doc = DOCS.find(d => d.id === S.sel[S.p]), dd = doc && docDue(doc);
  document.getElementById('sw-name').textContent = VARS[S.v].name;
  document.getElementById('sw-axis').textContent = VARS[S.v].axis.split('.')[0];
  document.getElementById('sw-state').textContent = doc ? `선택: ${doc.id} ${doc.peak} · ${stateLabel(doc, P)}${dd ? ' · 기한 ' + dueTxt(dd.due) : ''}` : '선택한 건 없음';
  syncUrl();
}
function go(dir) { const ks = Object.keys(VARS); S.v = ks[(ks.indexOf(S.v) + dir + ks.length) % ks.length]; S.holdFor = null; render(); }

const sel = document.getElementById('persona');
sel.innerHTML = PERSONAS.map(x => `<option value="${x.id}">${x.label}</option>`).join('');
sel.value = S.p;
sel.addEventListener('change', () => { S.p = sel.value; S.holdFor = null; render(); });
document.getElementById('sw-prev').addEventListener('click', () => go(-1));
document.getElementById('sw-next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('details.cl')) document.querySelectorAll('details.cl[open]').forEach(d => { d.open = false; });
  const b = t.closest('[data-act]');
  if (!b || b.disabled) return;
  const id = b.dataset.id, st = id && ST[id], P = persona(), stamp = `${md(NOW)} ${NOWTIME}`;
  const H = w => `<span class="tag-human">사람</span> 행위자·책임자 ${w}`;
  switch (b.dataset.act) {
    case 'sel': S.sel[S.p] = id; S.holdFor = null; break;
    case 'ptr': { const L = queue(S.p).open; if (!L.length) break; let i = L.findIndex(d => d.id === S.sel[S.p]); i = (i + +b.dataset.d + L.length) % L.length; S.sel[S.p] = L[i].id; S.holdFor = null; break; }
    case 'judge': {
      const o = DOPT[b.dataset.cl][+b.dataset.i], box = b.closest('.judge'), ta = box.querySelector('textarea'), note = ta ? ta.value.trim() : '';
      if (o.eff === 'hold') { S.holdFor = id; break; }
      if (o.need && !note) { const m = document.createElement('div'); m.className = 'msg'; m.textContent = '사내 지급 인정 이유를 적어야 동의 요건이 선다(PRC-13-5).'; box.appendChild(m); return; }
      st.judg[b.dataset.cl] = { k: o.k, eff: o.eff, note, by: whoName(P.who) };
      st.log.push([stamp, `재량 판단 기록 — ${b.dataset.cl}: ${o.k}${note ? ' · 이유: ' + note : ''}`, H(whoName(P.who))]);
      break;
    }
    case 'pair': { const e2 = DOCS.find(d => d.id === id).ev.find(x => x.id === b.dataset.ev); st.pair[e2.id] = b.dataset.v; st.log.push([stamp, `짝 확인 — ${e2.what}: ${b.dataset.v}`, H(whoName(P.who))]); break; }
    case 'approve': st.status = '처리함'; st.log.push([stamp, P.role === '재무합의자' ? '동의' : '승인', H(whoName(P.who))]); S.holdFor = null; { const L = queue(S.p).open; if (L.length) S.sel[S.p] = L[0].id; } break;
    case 'hold-open': S.holdFor = id; break;
    case 'hold-cancel': S.holdFor = null; break;
    case 'hold-send': { const ta = b.closest('.hold').querySelector('textarea'); st.status = '보류'; st.q = ta.value.trim(); st.log.push([stamp, '보류 — 질문을 기안자에게 보냄', H(whoName(P.who))]); S.holdFor = null; break; }
  }
  render();
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.origd') || !d.open) return;
  const st = ST[d.dataset.id];
  if (!st.orig[d.dataset.ev]) { st.orig[d.dataset.ev] = true; st.log.push([`${md(NOW)} ${NOWTIME}`, `원본 열람 — ${d.dataset.ev}`, `<span class="tag-human">사람</span> ${whoName(persona().who)}`]); }
  document.querySelectorAll(`[data-origcount="${d.dataset.id}"]`).forEach(x => { x.textContent = Object.keys(st.orig).length; });
}, true);

/* =====================================================================
   13. 자체 점검 — 전결표 계산 예와 같은 값이 나오는가, 증빙 합계가 청구와 맞는가. 결과는 화면 머리에.
   ===================================================================== */
function selfCheck() {
  const bad = []; let ok = 0, evOk = 0, evN = 0;
  [['D5', 'E1'], ['L4', 'E2'], ['L1', 'E4'], ['L2', 'E5'], ['D1', 'E6'], ['D6', 'E7']].forEach(([id, e]) => {
    const c = calc(DOCS.find(x => x.id === id) || LINKED[id]), x = EXPECT[e];
    if (c.total === x.총액 && c.within === x.한도적용금액 && c.title === x.전결권자) ok++; else bad.push(`${id}≠${e}(${c.total}/${c.within}/${c.title})`);
  });
  const l7 = calc(DOCS.find(x => x.id === 'D6')), l7s = l7.apv.join(',');
  if (l7s !== '품질보증팀장,생산본부장,대표이사' || l7.fin.length !== 1) bad.push('E7 결재선 ' + l7s);
  DOCS.filter(d => d.ev).forEach(d => d.items.forEach(it => {
    if (it.kind === 'perDiem') return; evN++;
    const s = d.ev.filter(e => e.item === it.k).reduce((a, e) => a + e.krw, 0);
    if (s === it.actual) evOk++; else bad.push(`${d.id} ${it.k}: 증빙 ${s} ≠ 청구 ${it.actual}`);
  }));
  if (WD[dt(NOW).getUTCDay()] !== '수') bad.push('NOW 요일');
  const nocl = new Set();
  PERSONAS.forEach(p => { S.p = p.id; DOCS.forEach(d => { (card(d, p, 'a') + card(d, p, 'c') + bOpen(d, p)).replace(/data-nocl="([^"]+)"/g, (m, x) => { nocl.add(x); return m; }); });
    ['a', 'b', 'c'].forEach(v => { S.v = v; S.sel = {}; render(); }); });
  if (nocl.size) bad.push('원문 없는 조항 ' + [...nocl].join(','));
  const el = document.getElementById('selfcheck');
  el.textContent = bad.length ? `자체 점검 실패: ${bad.join(' / ')}` : `자체 점검 통과 — 전결표 계산 예 ${ok}/6 · E7 결재선 · 증빙 합계 ${evOk}/${evN} · 원문 없는 조항 0 · 세 안 × 세 큐 렌더`;
  if (bad.length) el.classList.add('bad');
}
const V0 = S.v, P0 = S.p;
selfCheck();
S.v = V0; S.p = P0; S.sel = {}; sel.value = S.p;
render();
</script>
